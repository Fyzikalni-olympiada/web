- id: 900
  author: Honza
  title: Energie kmitání
  posted: '2008-05-31 16:02:15'
  who: student
  text: Mám dotaz k&nbsp;příkladu 8 ze studijního textu Funkce ve fyzice. V&nbsp;autorském řešení se nejdřív spočítá počateční rychlost a&nbsp;výchylka oscilátoru po dopadnutí plastelíny a&nbsp;potom se utvoří rovnice zachování energie, z které se získá maximální výchilka oscilátoru. Proč nelze položit energii oscilátoru rovnou potenciální energii plastelíny nad zavěšenou miskou? Vychází pak menší výchylka a&nbsp;i celkově to vypadá chybně. Správná hodnota mi vyšla, až když jsem k&nbsp;p.e. plastelíny přičetl energii, o&nbsp;kterou se "zvětšila" energie pružiny po zavěšení misky. Pokud jsme ale po zavěšení misky pružinu zastavili v&nbsp;rovnovážné poloze, oscilátor vlastně žádnou energii neměl a&nbsp;jediná energie, o&nbsp;kterou byl obohacen byla jen p.e. dopadnuté plastelíny. Mohl by na to někdo posvítit?
  children:
  - id: 901
    author: M. Jarešová
    email: Jaresova.m@seznam.cz
    title: 'Re: Energie kmitání'
    posted: '2008-06-10 08:26:17'
    who: student
    text: 'Ve výše popsaných úvahách vznikají problémy z toho důvodu, že tam dochází k&nbsp;rázu, v&nbsp;tomto případě se jedná o&nbsp;dokonale nepružný ráz, kde je již třeba také uvažovat s&nbsp;deformační energií při srážce. Je tedy třeba použít dva zákony&nbsp;&ndash; zákon zachování hybnosti a&nbsp;zákon zachování mechanické energie (toto je v&nbsp;případě srážek popsáno např. v&nbsp;učebnici Fyzika&nbsp;&ndash; Mechanika pro gymnázia&nbsp;&ndash; cvičení na konci učebnice). Je třeba počítat s&nbsp;tím, že potenciální energie plastelíny se při dopadu přemění jednak na energii deformační, zbývající energie pak způsobí rozkmitání nově vzniklého oscilátoru (nově vzniklého proto, že uvažujeme již jiné závaží na pružině, tj. M+m). Proto nevystačíme s&nbsp;pouhým použitím energetické úvahy padající plastelíny pro rozkmitání oscilátoru a&nbsp;je třeba nejprve užitím ZZH určit velikost počáteční rychlosti misky se závažím, tj. po srážce. '
    children:
    - id: 902
      author: Petr
      email: rejpalek@gmail.com
      title: 'Re: Re: Energie kmitání'
      posted: '2008-06-15 17:07:03'
      who: student
      text: A já měl za to, že při dokonale nepružném odrazu se veškerá kinetická energie (z pohledu těžišťové vztažné soustavy) přemění na nějakou jinou. Tak jak je to tedy?
      children:
      - id: 903
        author: M. Jarešová
        email: Jaresova.m@seznam.cz
        title: 'Re: Re: Re: Energie kmitání'
        posted: '2008-06-16 06:24:42'
        who: student
        text: Ve studijním textu Souřadnice ve fyzice od str.22 je problém rázu dokonale pružného i&nbsp;nepružného podrobně rozebrán v&nbsp;laboratorní i&nbsp;těžišťové soustavě (i z energetického hlediska). Myslím, že tam by se dala nalézt i&nbsp;odpověď na výše uvedenou otázku. Tento text je ke stažení na stránkách FO.
        children:
        - id: 904
          author: petr
          email: rejpalek@gmail.com
          title: 'Re: Re: Re: Re: Energie kmitání'
          posted: '2008-06-16 08:48:20'
          who: student
          text: No z uvedeného studijního textu, ze strany 23 cituji "V tomto případě už ale neplatí zákon zachování mechanické energie", jenžto se týká dokonale nepružného odrazu. Takže nechápu, jak, dle vašeho příspěvku z 10.6. lze použít v&nbsp;případě dokonale nepružného rázu zákon zachování mechanické energie, který dle odkazovaného textu neplatí.
          children:
          - id: 905
            author: M. Jarešová
            email: Jaresova.m@seznam.cz
            title: 'Re: Re: Re: Re: Re: Energie kmitání'
            posted: '2008-06-16 12:13:25'
            who: student
            text: 'Po přečtení své původní odpovědi bych asi odpověděla takto: v&nbsp;případě dokonale pružného rázu je nutné výslednou rychlost po srážce určit užitím zákona zachování hybnosti. Pak je možno spočítat mechanickou energii po srážce a&nbsp;odečíst tuto energii od původní energie. Pak dostaneme deformační energii. Ve své původní odpovědi jsem psala o&nbsp;použití zákona zachování hybnosti. Použití zákona zach. energie pak platí pro další část úlohy, kdy se zjišťuje maximální výchylka závaží na pružině, v&nbsp;tomto případě jsem tedy neměla ma mysli použití tohoto zákona v&nbsp;souvislosti s&nbsp;rázem.'
