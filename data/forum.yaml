  author: Student
  title: Zaokrouhlování-B1
  posted: '2021-02-21 20:11:44'
  who: student
  text: 'Dobrý den,  <br /><br />Jak by se měl v&nbsp;úloze B1 (kategorie B, první úloha) zaokrouhlit výsledek vzdálenosti, jestliže výška v&nbsp;zadání je 2,6 m (tedy zaokrouhleno na 2 platné cifry, tedy na dm) a&nbsp;tíhové zrychlení je 9,81 m*s-2 (tedy na 3 platné číslice). Jestliže by v&nbsp;této úloze vyšla délka stopy např: 62,57 cm nebo 123,3 cm nebo 6481,123 cm, jak by se měl výsledek zaokrouhlit? (Schválně jsme použil, jiné řádové čísla, abych nikomu případně ne napověděl) :) <br /><br />Děkuji '
  children:
  - id: 1799
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Zaokrouhlování-B1'
    posted: '2021-02-22 21:43:41'
    who: student
    text: 'Dobrý den, to je výborný dotaz, neboť nutnost správného zaokrouhlování se často i&nbsp;v&nbsp;FO podceňuje. Pokud se ve výrazu kombinuje součin, podíl, mocnina, odmocnina, pak výsledek zaokrouhlíme na tolik platných cifer, kolik platných cifer je u&nbsp;nejméně přesného údaje, např. 2,3156*3/0,26 = 26,7184... = 30 (nikoliv např. 27). Představme si, že číslo 3 ve výrazu znamená délku nějakého provázku v&nbsp;metrech, kterou jsme "změřili pohledem" bez délkového měřidla. Nemůžeme tak zaručit, že délka není např. 3,3 m. Pak by vyšlo 29,3903... , což by na 2 platné číslice dalo 29 místo 27. Z toho je vidět, že změna u&nbsp;2. platné číslice způsobí změnu (zpravidla) také u&nbsp;2. platné číslice.<br />Vyjadřuje-li číslo 3 např. počet vagónů, pak jsme oprávněni výsledek číselného výrazu zaokrouhlit na 27, protože číslo 3 je v&nbsp;tomto významu absolutně přesné (byť je také získáno pohledem) a&nbsp;nejméně přesný údaj je číslo 0,26 s&nbsp;2 pl. ciframi.<br />Zvláštní situace může vzniknout
      při odčítání a&nbsp;sčítání:<br />2,347&nbsp;&ndash; 2,341254 = 0,005746 musí být zaokrouhleno na 0,006, tedy ze 4 a&nbsp;7 platných cifer získáme výsledek s&nbsp;přesností pouze na 1 platnou cifru (u prvního čísla neznáme počet desetitisícin, nemůžeme znát počet desetitisícin ani u&nbsp;výsledku). Tento problém vzniká při odčítání blízkých čísel.<br />2,34 + 0,003 = 2,343 musí být zaokrouhleno na 2,34, tedy ze 3 a&nbsp;1 platné cifry získáme výsledek na 3 platné cifry.<br />V uvedené úloze FO zaokrouhlíme výsledek na 2 platné číslice s&nbsp;ohledem na vámi správně popsanou přesnost vstupních údajů, pokud tam nevznikne "anomálie" typu např. rozdílu dvou blízkých čísel.<br />  '
