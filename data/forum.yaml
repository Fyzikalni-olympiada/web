- id: 1718
  author: Lukáš Veškrna
  email: lukas.veskrna@gmail.com
  title: Zdroj náhody pro praktickou úlohu kategorie C
  posted: '2020-03-10 20:46:13'
  who: student
  text: Dobrý den,<br /><br />rád bych měl ještě jeden doplňující dotaz k&nbsp;praktické úloze z kategorie C.<br />Jestli jsem úlohu pochopil správně, házení mincí v&nbsp;ní figuruje jako zdroj náhody pro simulaci. Bylo by tedy možné použít místo házení mincí méně náročný, avšak srovnatelný způsob generování hodů? Mohu například použít pseudonáhodný generátor čísel s&nbsp;uniformní distribucí pro generování hodů – čísel v&nbsp;intervalu <0; 1>?<br />Pokud vím, nic to nemění na podstatě úlohy, kterou je simulace chování částic a&nbsp;zkoumání binomiální distribuce. Hod mincí závisí např. na způsobu, jakým je hozena, což ve výsledku zbytečně ovlivňuje simulaci, která s&nbsp;hodem mince nesouvisí. <br />Jestliže je házení mincemi opravdu nutné, rád bych znal jeho význam.<br /><br />Děkuji za skvělou úlohu a&nbsp;rychlou odpověď na předchozí dotaz,<br />Lukáš Veškrna
  children:
  - id: 1719
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Zdroj náhody pro praktickou úlohu kategorie C'
    posted: '2020-03-10 23:44:58'
    who: student
    text: Osobně doporučuji uznat jakýkoliv "losovací" systém, který je s&nbsp;uvedenou simulací pomocí mincí ekvivalentní, jen je třeba tuto ekvivalenci stručně zdůvodnit. Lze použít generátor pseudonáhodných čísel stejně jako hrací kostku (dvě trojice předem definovaných hodnot). Výsledek hodu mincí může záviset na způsobu hodu, proto každý hod musí být proveden tak, aby byl jeho výsledek nepřevídatelný.
