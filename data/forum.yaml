    who: ucitel
    text: 'Dobrý den.<br />Oběma požadavkům pravděpodobně nelze současně vyhovět bez porušení soutěžního řádu jedné či druhé soutěže. Asi nezbývá, než zvolit účast pouze v&nbsp;jedné z nich.<br />Soutěží a&nbsp;dalších akcí na školách je tolik, že se dají jen velmi obtížně umístit do kalendáře bez vzájemné termínové kolize. Snad se to daří aspoň u&nbsp;sobě blízkých oborů.  '
