    posted: '2015-03-18 17:05:38'
    who: ucitel
    text: Dobrý den,<br />prosím kontaktujte svého okresního či krajského koordinátora, ten Vám řešení měl doručit již před termínem odevzdání nebo nejpozději s&nbsp;ním.<br />S pozdravem<br />Lukáš Ledvina
