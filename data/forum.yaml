  author: Ivo Volf, púředseda ÚKFO
  email: ivo.volf@uhk.cz
  title: Délka trvání okresního v kategoriích E, F a krajského kola v
  posted: '2011-12-14 06:54:02'
  who: ucitel
  text: 'V organizačním řádu není stanoveno, jak dlouho mohou řešit úlohy soutěžící v&nbsp;okresním či krajském kole v&nbsp;kategoriích E, F. Tuto část, stejně jako kritérium úspěšnosti, řeší směrnice, kterou společně se zadáním úloh jednotně pro celou republiku stanovuje Ústřední komise Fyzikální olympiády. Okresní či krajské kolo probíhá v&nbsp;celé České republice v&nbsp;týž den a&nbsp;soutěž začíná zpravidla v&nbsp;9 h (podle možností dojezdnosti soutěžících a&nbsp;pedagogického dozoru. Po sdělení nutných informací soutěžícím a&nbsp;krátkým prostudováním textu zadaných úloh soutěžícími, zodpovězení dotazů, jež jsou spojeny s&nbsp;vysvětlením některých nejasností, se potom vyhlásí začátek soutěže a&nbsp;pro 4 úlohy se stanoví 4 h čistého času. Soutěžící může vyřešit úlohy v&nbsp;kratší době, ale tyto 4 h jsou limitní; po jejich uplynutí musí soutěžící své řešení odevzdat dozorujícímu členu okresní, popř. krajské komise.<br />Kritérium úspěšnosti je podle organizačního řádu stanoveno takto:
    Řešení každé úlohy je hodnoceno 10 body, přičemž úspěšný soutěžící musí získat minimálně 14 bodů a&nbsp;současně alespoň ve dvou úlohách zabodovat alespoň na 5 bodů (nestačí tedy např. získat z jedné úlohy 10 b a&nbsp;z další 4 b (nebo z dalších dvou úloh    2 b + 2 b) ). Pro postup do okresního kola musí soutěžící získat alespoň v&nbsp;pěti úlohách z každé minimálně 5 bodů.'
