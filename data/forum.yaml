    text: "Původně byly studijní texty krátké a&nbsp;byly otisknuty v&nbsp;Rozhledech matematicko-fyzikálních. Od roku 1967 začala vycházet Škola mladých fyziků, v&nbsp;níž vyšlo během 25 let celkem 25 svazků ve formátu A6. Od r. 1992 jsme založili Knihovničku fyzikální olympiády, v&nbsp;níž vycházejí jednak Letáky FO, jednak texty pro studium. Přehled vydaných materiálů v&nbsp;letech 1992-5 najdete v&nbsp;části Literatura na naší internetové stránce www.uhk.cz/fo , kde jsme uvedli přehled textů vydaných až do roku 2001. Na CDRomu jsou studijní texty, které byly pro tisk připravovány v&nbsp;latechu.\r<br />Pro zájemce ještě uvádím, že studijní texty pro letošní rok jsou v&nbsp;závěrečné fázi.          Ivo Volf"
