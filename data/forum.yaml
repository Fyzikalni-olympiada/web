- id: 1960
  author: Jana Hanzlíková
  email: jana.hanzlikova@zsmukarov.cz
  title: Registrace na FO, řešení a kam posílat - opětovný dotaz a pr
  posted: '2023-01-21 15:50:51'
  who: ucitel
  text: 'Dobrý den,<br />již jsem zde dotaz pokládala, bohužel neúspěšně. Ač se zde ptáme všichni na víceméně totéž, dostáváme odpovědi pouze individuálně na email (protože každý kraj to má jinak). Ostatním se pravděpodobně podařilo získat odpovědi, mně se z nějakého důvodu nepodařilo odpověď získat. Ptám se tedy znovu a&nbsp;MOC MOC prosím o&nbsp;odpověď (dejte mi, pls, třeba do kopie...): Musím se jako učitel registrovat, případně kde? Mohu požádat o&nbsp;vzorová řešení pro E,F? Kam mám řešení žáků poslat? Na koho se mohu obracet? Co bych jako učitel vedoucí žáky FO měla hlídat a&nbsp;neopomenout? Jsem z Mukařova u&nbsp;Říčan (okres Praha-východ, kraj Středočeský).<br />Snažila jsem se opakovaně pátrat a&nbsp;zjistit více, ale stránky středočeského kraje jsou nefunkční, resp. neexistují. Zde v&nbsp;diskusi jsem odpověď zatím nedostala. PLS HELP! Mám řešitele fyzikální olympiády a&nbsp;potřebuji informace, jak máme postupovat dál. S&nbsp;pozdravem Jana Hanzlíková'
  children:
  - id: 1961
    author: Jindřich Pulíček
    email: pulicek@randovka.cz
    title: 'Re: Registrace na FO, řešení a kam posílat - opětovný dotaz '
    posted: '2023-01-27 12:42:19'
    who: ucitel
    text: Dobrý den,<br />registrace se např. pro náš Liberecký kraj bude týkat jen krajského kola kategorie E. Kategorie A,B,C a&nbsp;D mají registraci do OSMO povinou. Váš šéf by měl být RNDr. Vladimír Kulich&nbsp;&ndash; Gymnázium Slaný. Řešení zasílají předsedové krajských komisí (nebo jimi pověřené osoby) referentům FO na školy (někdy to chodí ředitelům)&nbsp;&ndash; pokud budete mít problém, mohu zaslat, ale starám se o&nbsp;Liberecký kraj.<br />Jindřich Pulíček
