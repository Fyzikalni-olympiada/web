    text: Vypište všechny přímé vlaky na trase Paris Nord – Bruxelles-Midi, může jich být tak 13 párů. Do řešení uveďte, pro jaké datum a&nbsp;den v&nbsp;týdnu jste úlohu řešil. Vzálenost uvažujte u&nbsp;všech spojů stejnou, průměrnou rychlost vypočítejte nejlépe pro obě krajní hodnoty.
