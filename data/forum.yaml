  text: 'Dobrý den,<br />rád bych požádal o&nbsp;upřesnění zadání úlohy č. 2 (RLC obvod) v&nbsp;kategorii B letošního ročníku Fyzikální olympiády, konkrétně podúlohy d).<br />Otázka zní: „Jaký proud bude procházet obvodem při frekvenci generátoru f₁?“ Bohužel z textu není zřejmé, zda se má jednat o&nbsp;sériové nebo paralelní zapojení obvodu. V&nbsp;předchozí podúloze c) je explicitně zmíněno paralelní zapojení, což může vyvolat nejasnosti ohledně pokračování konfigurace v&nbsp;podúloze d).<br />Chtěl bych se tedy ujistit, zda se jedná o&nbsp;chybu v&nbsp;zadání, nebo zda je zamýšlená konfigurace obvodu v&nbsp;podúloze d) jasně daná.<br />Děkuji za váš čas a&nbsp;ochotu k&nbsp;objasnění.<br />S pozdravem.'
