          text: "Myslím, že větou \"pohyb elektronů je omezen úsečkou\" se říká, že pokud nebude obvod uzavřený, působí na elektrony jenom svislá magnetická síla a&nbsp;elektrony se tedy mohou pohybovat jenom v&nbsp;úsečce. Jestliže obvod uzavřeme, začne jím samozřejmě téci proud.\r<br />\r<br />Na všechny elektrony v&nbsp;tyčce působí pouze magnetická síla, která má pro všechny elektrony stejný směr a&nbsp;velikost (pokudz zanedbáme velikost rychlosti jejich pohybu vůči tyčce vzhledem k&nbsp;velikosti rychlosti pohybu tyčky). Takže intenzita elektrického pole v&nbsp;tyčce je všude stejná."
