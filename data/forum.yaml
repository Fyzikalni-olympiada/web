        text: Tezsi je dost mozna tuna zeleza, protoze je slozeno z atomu s&nbsp;vyssim protonovym cislem. V&nbsp;takovych atomech pusobi na elektrony vyssi pritazliva sila, proto se pohybuji blize k&nbsp;atomovemu jadru. Protoze se pohybuji blize k&nbsp;jadru, maji dle semiklasicke limity kvantove mechaniky (Bohrova podminka) vyssi rychlost, coz dle teorie relativity trivialne znamena, ze maji vetsi hmotnost. Je mozno spekulovat o&nbsp;tom, ze tento nijak maly posun hmotnosti elektronu na nejnizsich atomovych jadrech vede k&nbsp;tomu, ze tuna zeleza je tezsi nez tuna dreva. Ale to jsou cire spekulace :-)
