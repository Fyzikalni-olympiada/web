    title: 'Re: B spalovaci motor'
    posted: '2008-03-13 11:57:13'
    who: student
    text: "Výkon motoru lze vypočítat s&nbsp;využitím znalosti pracovního cyklu ze stavové rovnice a&nbsp;první věty termodynamické. Výhřevnost je zadaná pro výpočet hodinové spotřeby paliva&nbsp;&ndash; benzínu.\r<br />\r<br />Lze samozřejmě postupovat tak, jak píšeš ty. Z hustoty směsy určit hmotnost čistého benzínu a&nbsp;pomocí výhřevnosti potom vypočítat výkon motoru. K&nbsp;tomu je však nutné znát hustotu vzduchu, která není zadaná a&nbsp;jejíž hodnota zavisí nejenom na tlaku a&nbsp;teplotě ale také například na hodnotě rosného bodu. \r<br />\r<br />Výsledky těchto dvou postupů se tedy mohou dosti lišit."
