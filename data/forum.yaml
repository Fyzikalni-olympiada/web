- id: 3
  author: Marek Tyle
  email: mtyle@gymna-pi.cz
  title: Instruktážní řešení úloh
  posted: '2004-09-13 22:00:00'
  who: ucitel
  text: 'Po zkušenostech z&nbsp;mnoha let předchozích i&nbsp;z&nbsp;loňského, kdy bylo instruktážní řešení úloh na naši školu doručeno až na moje výslovné upozornění, avšak bohužel až těsně před uzávěrkou, se ptám: nebylo by možno tato řešení distribuovat na školu v&nbsp;elektronické podobě? Bylo by to mnohem rychlejší, třeba už během září! Proč bych měl od žáků chtít řešení prvních úloh už na konci listopadu, když nevím, jak je obodovat? Taky si kolikrát sám nevím rady s&nbsp;řešením, když se mne žáci v&nbsp;průběhu roku ptají. Děkuji za odpověď.'
  children:
  - id: 4
    author: Ivo Volf
    email: ivo.volf@uhk.cz
    title: 'Re: Instruktážní řešení úloh'
    posted: '2004-09-19 22:00:00'
    who: ucitel
    text: "Záleží na tom, zda jde o&nbsp;soutěž pro školy základní nebo střední. Pro základní školy (EF) jsme v posledních letech posílali pouze výsledky na Internet a&nbsp;úplné řešení vyšlo v časopise Školská fyzika. Tam také vyšly celkem tři série nazvané \"návodné úlohy\"&nbsp;&ndash; vyřešené úlohy trochu podobné soutěžním, aby učitel měl náměty k další činnosti se svými žáky. Pro střední školy (ABCD) posíláme instruktážní řešení současně se zadáním již po několik let. Tato řešení mají vždy předsedové KVFO. Souhlasím s&nbsp;tím, že by učitel měl mít řešení co nejdříve, ale máme zkušenosti i&nbsp;s&nbsp;tím, že řešení nechá doslova opsat žákům, a&nbsp;to není dobré.<br><br>\r\nVím, že občas něco zaskřípe, ale všichni to děláme ve svém volném čase. Buďte tedy tolerantní k&nbsp;našim nedostatkům a snažte se nám pomoci. Například tak, že budete vymýšlet úlohy. "
- id: 1
  author: Vanessa
  email: PVANESS@seznam.cz
  title: Soustředění
  posted: '2004-09-21 22:00:00'
  who: student
  text: Jak se dostat na fyzikální soustředění ?
  children:
  - id: 2
    author: Jan Houštěk
    email: jan.houstek@mff.cuni.cz
    title: 'Re: Soustředění'
    posted: '2004-09-22 22:00:00'
    who: student
    text: "Na soustředění na Táni se snažíme vybrat vždy ty nejlepší řešitele FO v&nbsp;daném roce, kteří ještě nekončí střední školu.<br><br>\r\n\r\nZákladním (nikoliv jediným) kritériem je dobrý výsledek ve II. kole kategorie B, případně účast ve II. nebo III. kole kategorie A. Řešitele navrhují předsedové RV FO.<br><br>\r\n\r\nŘešiteli, který chce maximalizovat svoji šanci na účast, doporučujeme:\r\n\r\n<ol><li> řešit kategorii A i&nbsp;přesto, že ještě nenavštěvuje poslední ročník střední školy (není to nijak neobvyklé, v&nbsp;historii FO existuje i&nbsp;několik řešitelu, kteří se úspěšně účastnili III. kola čtyřikrát :-)\r\n<li> dobře se umístit ve II. kole kategorie B\r\n<li> dát vědět předsedovi svého RV FO, že má o&nbsp;soustředění zájem\r\n<li> kontaktovat přímo organizátory soustředění (nejlépe mne e-mailem)</ol>"
- id: 48
  author: Karlos
  email: Rx_Kisser@seznam.cz
  title: Jak funguje rychlovarná konvice?
  posted: '2004-10-29 18:58:14'
  who: student
  text: Potřeboval bych detailně popsat rychlovarnou konvici, tedy spínání-vypínání... Díky
  children:
  - id: 49
    author: Jan Houštěk
    email: jan.houstek@mff.cuni.cz
    title: 'Re: Jak funguje rychlovarná konvice?'
    posted: '2004-10-30 19:09:31'
    who: student
    text: "Výkonná část je poměrně jednoduchá, síťové napětí je přivedeno na spirálu zhotovenou z materiálu s&nbsp;vhodným odporem (dle zamýšleného příkonu konvice). Bývá zařazen i&nbsp;nějaký ochranný prvek (většinou obyčejná pojistka, ve které se přepálí vlákno při průchodu nadměrného proudu).\r<BR>\r<BR>Spínací část je realizovaná běžným mechanickým kontaktním spínačem, vypínání je přitom (mechanicky) napojeno na mechanismus, který nepovolí spuštění (resp. zajistí vypnutí) při dosažení určité teploty. Nejčastěji bývá realizovaný mechanicky (bimetalovým páskem, který je přes pružinu napojen na mechanický spínač).\r<BR>\r<BR>Jinak bych ti pro podobné dotazy doporučil spíše web http://fyzweb.mff.cuni.cz a&nbsp;jeho odpovědnu. Toto fórum je přeci jen určeno především pro problematiku fyzikální olympiády."
