- id: 1757
  author: David
  email: skola0612@gmail.com
  title: Zákon zachování mechanické energie
  posted: '2020-05-14 10:14:36'
  who: student
  text: 'Dobrý den,<br /><br />V jednom studijním materiálu jsem našel tuhle poznámku: <br /><br />"Mnoho lidí tvrdí (a dokonce je to názor mezi učiteli), že když E1 = Ep+0= Ep v&nbsp;horní poloze a&nbsp;E2 = 0+Ek = Ek v&nbsp;dolní poloze a&nbsp;jde o&nbsp;stejnou hodnotu, pak došlo k&nbsp;přeměně polohové energie na energii kinetickou“. V&nbsp;našem pojeti je však energie fyzikální veličina, a&nbsp;ta má určitou hodnotu. Energie se tedy nepřeměnila, ale při volném pádu se polohová energie zmenšuje a&nbsp;pohybová energie zvětšuje, avšak jejich součet má stálou hodnotu. To bychom rovněž mohli tvrdit, že výška nad terénem se mění na rychlost kolíčku nebo v&nbsp;případě vrhu, se napětí v&nbsp;pryži mění na rychlost kamene, popř. ve vzduchovce se tlak vzduchu mění na rychlost broku. Ponechme tedy pojmu energie jeho původní význam: jde o&nbsp;stavovou veličinu, která v&nbsp;mechanice vyjadřuje polohový nebo pohybový stav tělesa vzhledem k&nbsp;určité soustavě. "<br /><br />V přehledu středoškolské
    fyziky (E. Svoboda) je ZZME definován takto:<br /><br />"Při všech mechanických dějích se MĚNÍ potenciální energie v&nbsp;kinetickou a&nbsp;naopak, přičemž celková mechanická energie izolované soustavy je konstantní."<br /><br />Podle autorů učebnice se tedy přeměňuje&nbsp;&ndash; mění Ep v&nbsp;Ek a&nbsp;naopak, tudíž bych se chtěl zeptat, jaké tvrzení je to správné.<br />Předem děkuji za odpověď.<br /><br />'
  children:
  - id: 1768
    author: Risa
    email: risa.student@seznam.cz
    title: 'Re: Zákon zachování mechanické energie'
    posted: '2020-06-24 08:31:41'
    who: student
    text: ZZME = zakon zachovani mechanicke Energie.<br /><br />Ve vzduchovce atd. mas i&nbsp;jine formy Energie. Dle obecneho konsensu se celkova Energie izolovane soustavy nemeni. Ze se polohova E premenuje na kinetickou se rika, pac je to jednodussi na predstavu.
