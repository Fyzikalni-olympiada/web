    text: Předpokládá se, že rychlost letadla se z klidu zvětšuje lineárně s&nbsp;časem, tedy že v&nbsp;= k&nbsp;. t, sestroj si graf závislosti rychlosti na čase (graf v(t)), a&nbsp;tím je polopřímka (úsečka) procházející počátkem. Obsah plochy mezi osou času t a&nbsp;úsečkou je roven číselně dráze, kterou rozjíždějící se těleso urazí. To by už mělo stačit. Když ti něco nejde, tak to musíš zkoušet tak dlouho, až to jde. Jen zbabělci to vzdávají.      Prof. Volf
