- id: 1707
  author: Zájemce o fyziku
  title: Zaokruhlování v FO
  posted: '2020-02-25 14:15:06'
  who: student
  text: Dobrý den,<br /><br />proč se ve fyzice nezaokrouhlují výsledky na 2 desetinná místa, ale na 2 platné cifry? Protože zaokrouhlování na dvě platné cifry zanedbává zanedbatelné hodnoty a&nbsp; uvažuje možnou chybu?  Např. kdyby u&nbsp;cvičení 1 v&nbsp;kategorii C počet vagonu, vyšlo necelé číslo, tak se musí zaokrouhlit výsledek na dvě platné cifry,  tedy aby byla v&nbsp;úvahu  možná chyba měření? Nebo vypočítaný výsledek musí být po dosazení hodnot vždy celý? Tedy uvažování chyby je nesmyslné, protože se jedná o&nbsp;teoretický příklad, kde chyba měření neexistuje.
  children:
  - id: 1712
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Zaokruhlování v FO'
    posted: '2020-03-01 00:28:45'
    who: student
    text: 'Výsledky zaokrouhlujeme podle zadané přesnosti vstupních údajů. Přesnost posuzujeme podle počtu platných číslic, nikoliv podle počtu desetinných míst. Představme si, že z hustoty oceli v&nbsp;gramech na centimetr krychlový a&nbsp;z hmotnosti v&nbsp;gramech vypočteme průměr ocelové kuličky v&nbsp;centimetrech. Z kalkulačky získáme v&nbsp;centimetrech výsledek např. 1,234567891. Při zaokrouhlení např. na 2 platné číslice dostaneme podle zvolené jednotky výsledek 1,2 cm = 12 mm = 12 000 mikrometrů = 0,012 m = 0,000 012 km atd. Při zaokrouhlení na 2 desetinná místa získáme výsledky 1,23 cm, 12,34 mm, 12 345,67 mikrometrů, 0,01 m, 0,00 km atd. Vidíme, že zaokrouhlení na daný počet platných číslic je nezávislé na jednotce, ve které výsledek vyjádříme.<br />K druhé části otázky: Ve vymyšlené úloze můžeme vymyslet vstupní údaje tak, aby počet vagónů vyšel celé číslo. V&nbsp;praxi musíme vstupní hodnoty buď s&nbsp;nějakou přesností změřit, nebo někde nalézt, ale ty opět musely být s&nbsp;nějakou
      přesností změřené. Z tohoto důvodu nám výsledný počet nedělitelných objektů (vagónů, osob, neutronů apod.) nemusí vyjít celočíselně. Výsledek pak na celé číslo zaokrouhlíme, či podle situace udáme alternativu např. 7 nebo 8 osob ve výtahu, nebo např. 160 až 180 naložených automobilů při odvozu zeminy apod.   '
