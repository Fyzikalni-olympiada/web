    title: 'Re: FO C úloha 1, školní kolo'
    posted: '2024-01-10 20:11:41'
    who: ucitel
    text: 'Dobrý den.<br />Na uvedeném odkazu se též v&nbsp;odpovědi uvádí, že za běžných podmínek použijeme koeficient 5/2, neboť "vibrace k&nbsp;tepelné kapacitě za běžných podmínek prakticky nepřispívají". Tepelná kapacita počítaná s&nbsp;koeficientem 5/2 je také v&nbsp;souladu s&nbsp;tabulkovou hodnotou, jak se dále uvádí.<br />Stejně tak ve studijním textu FO, Šedivý, P.: Kruhový děj s&nbsp;ideálním plynem, je v&nbsp;dodatku na s. 21 uváděná stejná hodnota 5/2. Hodnota 7/2 se uplatňuje při vyšších teplotách, kterých v&nbsp;naší úloze nedosáhneme. '
