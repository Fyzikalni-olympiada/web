              who: student
              text: "Ne,v tom problém není.Uvažujeme-li J'>0\r<br />pak přibyde další rovnice\r<br />J'*eps'=(T1-T2)r' pro hmotnou kladku.\r<br />(Pro J'=0 pak je T1=T2=T.).Dosadíme-li do výsledků př.4 v&nbsp;textu J'= nekonečno vyjde zryhlení tělesa a2=0.To je správně.Soustava je pak totožná se soustavou v&nbsp;řešeném př.9 v&nbsp;témže textu.Lanko pevně zavěšeno.Vypočítáme limitu a1(jojo) pro\r<br />J'nekonečno(typ nek/nek).(Použijeme L'Hospitalovo pravidlo ).Musí vyjít to co v&nbsp;příkladu 9.Při + před závorkou ve jmenovateli \"a1\" to vyjde.Pro&nbsp;&ndash; co je v&nbsp;textu ne. a1 v&nbsp;tomto případě musí být a1=g/(1+J/mr^2).    "
