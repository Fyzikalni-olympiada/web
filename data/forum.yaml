    posted: '2007-07-14 17:05:23'
    who: ucitel
    text: "MIlí přátelé,\r<br />úlohy kategorie G Fyzikální olympiády jsou určeny pro žáky-sedmíky. Domní¨val jsem se, že je v&nbsp;silách každého učitele fyziky, aby si úlohy vyřešil a&nbsp;pomohl pak svým žákům, aniž by potřeboval k&nbsp;tomu nějakou berličku. Jestliže se však opravdu domníváte, že pro ohodnocení řešení potřebujete návod a&nbsp;bodování (je to však pro vás, pro vaše žáky, většinou jde tedy o&nbsp;hodnocení relativní), v&nbsp;příštím roce je umístíme tak, jako v&nbsp;kategoriích EF&nbsp;&ndash; výsledky a&nbsp;měřítka hodnocení. \r<br />Děkuji vám za vaši práci a&nbsp;uvítal bych užší kontakt s&nbsp;vámi. Mou elektronickou adresu máte v&nbsp;každém letáku, ale ještě jednou ji uvedu: ivo.volf@uhk.cz .\r<br />S pozdravem a&nbsp;přáním prázdninového odpočinku    Ivo Volf"
