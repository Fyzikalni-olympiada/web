  posted: '2006-02-04 15:52:34'
  who: student
  text: "Nepochopil jsem ovsem proc je v&nbsp;reseni k&nbsp;uloze 5.3 pouzita derivace..\r<br />staci urcit cas za ktery jsou kapky vody zrychleny na rychklost vlaku, potom urcit kolik kg vody napada na vlak za tento cas a&nbsp;mame konstantni hmotnost m o&nbsp;kterou je vlak tezsi.. potom uz silu spocitame jako F= a.(m vlaku + m vody) a&nbsp;vyjde to stejne.."
  children:
  - id: 265
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Studijni text na dif. pocet'
    posted: '2006-03-05 23:04:25'
    who: student
    text: Tvoje fyzikální úvaha je špatná. Dle zadání nevíš, jak kapka dlouho zrychluje, než dosáhne rychlosti vlaku. (Předpokládáš, že kapky zrychlují se stejným zrychlením jako vlak a&nbsp;díky tomu je tvůj výsledek náhodou správně.) V&nbsp;úloze nejde o&nbsp;to, že se musí navíc urychlovat hmota vody, protože dešťová voda rovněž odkapává a&nbsp;předpokládá se, že celkové její množství na vlaku je daném okamžiku zanedbatelné vůči celkové hmotnosti vlaku. Třeba si uvědomit, že vlak mění svoji hybnost tím, že na něj neustále dopadají kapky vody, které mají nulovou horizontální rychlost.
