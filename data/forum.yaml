          author: martin
          email: tucek.m@volny.cz
          title: 'Re: Re: Dotaz k př4 . ÚLOHY Z MECHANIKY II.'
          posted: '2006-03-31 03:15:02'
          who: student
          text: "Napíšu pohybové rovnice pro J'=0 .\r<br />Zrychlení závaží a&nbsp;joja obě orientované dolů.a1 zr. závaží, a2 zr. joja .\r<br />ma1=mg-T1, ma2=mg-T2, T1=T2=T pro J'=0 \r<br />pak a1=a2=a , eps2*J=-Tr , eps2 je úhl.z. joja .\r<br />eps2=-(a2+a1)/r pak řešením soustavy rov. a=mgr^2/(mr^2 + 2J)(tento výsledek by měl vyjít při dosazení J'=0 do výsledků v&nbsp;textu, ale tam je před 2J znaménko&nbsp;&ndash; ). Po dosazení za\r<br />J=1/2mr^2 je a=g/2 , a&nbsp;při ověření podle\r<br />Z.Z. mech. energie je to \"OK \".Řešení\r<br />soustavy rovnic pro nenulové J' je velmi\r<br />pracné a&nbsp;proto jsem zvolil tento postup\r<br />kontroly.\r<br />"
