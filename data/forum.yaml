  posted: '2010-08-10 20:58:00'
  who: student
  text: 'Nejprve se omlouvám za spam, ale na foru se zobrazil pouze nadpis a&nbsp;ne text příspěvku. Snad už je tedy vše ok. . .<br />Mám dotaz k&nbsp;příkladu 4 v&nbsp;nadpisu zmiňovaném studijním textu.<br />1. Nerozumím rovnici (10), konkrétně členům u&nbsp;T na pravé straně. Rovnice nesedí jednotkově a&nbsp;nevidím žádný fyzikální důvod přítomnosti těch členů.<br />2. Tvrzení po rovnicí (10) mi přijde při nejmenším odvážné. <br />Cituji: Zrychlení a_1 hmotného středu válce je poloviční vzhledem ke zrychlení a_2 bodu na obvodu válce.<br />Přijde mi logické, že body na obvodu válce mají stejné zrychlení jako jeho těžiště (pokud se automobil pohybuje rovnoměrně tak obvodová rychlost bodů na pneumatikách je rovna rychlosti vozu. Nevidím důvod proč by to se zrychlením mělo být jinak&nbsp;&ndash; a&nbsp;pokud ano, proč zrovna 1/2?<br />Předem děkuji moc za odpověď'
