- id: 1919
  author: Zdeněk Polák
  email: polak@gymnachod.cz
  title: První úloha kat. B krajské kolo
  posted: '2022-04-28 12:54:06'
  who: ucitel
  text: 'Vyvraťte mi můj názor, že úloha je nesmyslná a&nbsp;podstatně složitější, než autor předkládá.<br /><br />Už bod a) nedává smysl. Jestliže pravý nehmotný závěs se může volně pohybovat ve vodorovném směru, pak na něj nemůže  jiná síla než síla ve svislém směru a&nbsp;stuha, která sama nemá hmotnost. Sám teday na stuhu může působiot jen ve svislém směru, nikoli ve směru vodorovném. Nemůže napínat stuhu vodorovnou složkou síly. Proto se váleček bude propadat směrem dolů volným pádem, nehmotný závěs se bude pohybovat doleva.<br />Autorské řešení předpokládá, že váleček visí ve ve stuze se zablokovaným závěsem, což je v&nbsp;rozporu se zadáním úlohy.<br /><br />Může autor sestrojit trajektorii válečku a&nbsp;směr rychlosti v&nbsp;okamžiku, kdy váleček  opustí stuhu?<br />Pokud by původní úhel byl 90°, a&nbsp;váleček pěkně visel u&nbsp;stěny, která síla by jej urychlovala tak, aby opustil stuhu pěkně uprostřed, jak to předpokládá autorské řešení? Byly by vůbec jednotlivé části stuhy namáhány
    stejnou tahovou silou, když váleček musí dostat zrychlení v&nbsp;kladném směru osy x? Já to vyřešit neumím,<br /><br />Jaký je důvod, že váleček vyletí svisle vzhůru?: Prosím o&nbsp;zveřejnění detailnější řešení, (včetně trajektorie válečku z počáteční polohy  alfa = 90°) které by ukázalo, kde  a&nbsp;pod jakým úhlem váleček opouští stuhu a&nbsp;vyvrátilo moje přesvědčení, že autorské řešení je chybné.<br />Moc by mi možná pomohlo, kdyby detailní řešení nalezl někdo , kdo úlohu neformuloval.<br />'
  children:
  - id: 1925
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: První úloha kat. B krajské kolo'
    posted: '2022-05-31 17:46:11'
    who: ucitel
    text: Dobrý den, pane Polák,<br /><br />co se týká části a), máte pravdu. V&nbsp;zadání chybí, že v&nbsp;tu chvíli je závěs zablokovaný.<br /><br />Co se týká předpokladu, že je váleček stále uprostřed stužky, také se mi nezdá, že to je pravda. Argument o&nbsp;zanedbatelné třecí síle jako důkaz nestačí. Ještě se nad tím zamyslím.
    children:
    - id: 1995
      author: Josef Jírů
      email: josef.jiru@email.cz
      title: 'Re: První úloha kat. B krajské kolo'
      posted: '2023-04-09 10:03:51'
      who: ucitel
      text: Mám též pochybnost, že váleček zůstává ve středu stuhy. Podle mého názoru je řešení provedeno tak, že stuha je tažena stálou silou přes pevnou tyčku umístěnou v&nbsp;poloze dané počátečním úhlem alfa.
