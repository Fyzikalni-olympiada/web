- id: 1329
  author: Jakub Sláma
  email: kubka.slamak@seznam.cz
  title: Celostátní kolo -- propozice
  posted: '2014-02-11 15:32:24'
  who: student
  text: 'Dobrý den,<br /><br />mám pár dotazů ohledně celostátního kola. Oproti informaci, která na webu vysela relativně dlouho (viz. např příspěvek #1326) se změnilo místo konání z Uherského Hradiště na Holešov, je to pravda a&nbsp;máme celostátní kolo čekat v&nbsp;Holešově? Kdy dostaneme propozice ohledně konání (harmonogram, ap. -- alespoň ohledně začátku a&nbsp;konci). Jelikož jsou příští týden v&nbsp;části republiky prázdniny, možná jiní mají stejný problém, budu pryč a&nbsp;nebudu mít možnost zařizovat věci na celostátní kolo FO-A, ať už se jedná o&nbsp;uvolnění ze školy, obstarání cesty do a&nbsp;z místa konání, atd. Proto bych Vás rád požádal o&nbsp;informace, ze kterých se závazně dozvíme alespoň místo konání, čas začátku, konce a&nbsp;informace ohledně ubytování a&nbsp;stravování. Pokud je potřeba potvrdit účast, tak i&nbsp;o&nbsp;tyto informace/dokumenty. Poslední dotaz -- cestovné si hradí účastníci sami?<br /><br />Děkuji a&nbsp;přeji hezký den'
  children:
  - id: 1330
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: Celostátní kolo -- propozice'
    posted: '2014-02-13 01:07:30'
    who: student
    text: Ano, celostátní kolo se bude konat na gymnáziu v&nbsp;Holešově. Propozice byste měli dostat prostřednictvím krajské komise, ev. přímo na email. Pokud patříte mezi postupující, určitě přijeďte, i&nbsp;kdyby se k&nbsp;vám pozvánka nedostala včas. Ubytování i&nbsp;stravování bude zajištěno. Cestovné bude proplaceno.
    children:
    - id: 1331
      author: Jakub Sláma
      email: kubka.slamak@seznam.cz
      title: 'Re: Celostátní kolo -- propozice'
      posted: '2014-02-13 14:28:38'
      who: student
      text: Děkuji za odpověď. Vzhledem k&nbsp;tomu, že na dotazy v&nbsp;diskusi pražské FO odpovídáte také vy, nebudu psát zbytečně druhý stejný dotaz. Ale k&nbsp;tomu, abych mohl přijet do Holešova, by bylo dobré vědět kdy (přeci jen pondělí je dlouhá doba). Mohu se tedy zeptat, v&nbsp;kolik (alespoň zhruba) máme být v&nbsp;Holešově u&nbsp;gymnázia?<br /><br />Děkuji
      children:
