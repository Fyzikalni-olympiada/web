      text: 'Dobrý den, já se obávám, že to bude příští rok naprosto stejné (ale rád se budu mýlit)&nbsp;&ndash; myslím si, že byste se mohli inspirovat např.  na stránkách Logické olympiády&nbsp;&ndash; vzhled také žádná hitparáda, ale informace o&nbsp;tom, kdo kde a&nbsp;kdy tam od krajského kola jsou. Také mají slušnou účast, o&nbsp;tom se vám může jen zdát. Chtělo by to nějakou větší propagaci&nbsp;&ndash; články a&nbsp;výsledky v&nbsp;DDM i&nbsp;jinde i&nbsp;v&nbsp;nižších kategoriích&nbsp;&ndash; nečekám zázraky, ale upřímně, viděl jsem letošní výsledky okresu Příbram  (strašné nízká účast&nbsp;&ndash; to pak se ani z vítězství nelze moc radovat)- a&nbsp;to mi stačilo.<br />Uvidíme za rok.<br />                      MH  '
