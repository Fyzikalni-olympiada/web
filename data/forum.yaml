  text: V novém textu Úlohy z mechaniky II. mi vyšlo v&nbsp;př.4 "jojo na kladce" ve jmenovateli před závorkou +,v textu ve výsledcích je-,jinak vše vyšlo stejně.Sestavil jsem poh. rovnice pro J kladky J'=0 a&nbsp;vyšlo také +,ve výsledku po dosazeni J'=0 vyjde to samé jako pro pohybové rovnice s&nbsp;J'=0 . Pro J'=0 jsem do výsledku dosadil za J joja moment setr.válce o&nbsp;r . Pak a1=a2=g/2.Pro&nbsp;&ndash; by to bylo nekonečno.Pro g/2 jsem ověřil z. zachování mech .energie.Při + ve výsledku je splněn.Pro&nbsp;&ndash; ne. Nejsem si ale 100% jist zda je ve výsledku v&nbsp;textu chyba.
