    text: Dobrý den.<br />Vpravo dole tohoto webu je možno otevřít soubor Pravidla pro určování pořadí, kde se uvádí:<br />"Ve školním kole FO se za úspěšného řešitele považuje soutěžící, který vyřešil alespoň pět<br />úloh na 5 nebo více bodů a&nbsp;zároveň odevzdal řešení experimentální úlohy. (Pokud je<br />hodnocena experimentální úloha alespoň 5 body, lze ji započítat mezi výše uvedených pět<br />úloh.)"<br />Bodování experimentální úlohy zpravidla uváděno není, je v&nbsp;kompetenci hodnotitele v&nbsp;dané škole, jak řešení posoudí a&nbsp;oboduje.
