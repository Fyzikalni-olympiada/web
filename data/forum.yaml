  text: Dobrý den, na stránkách Univerzity Karlovy, například na přírodovědecké fakultě (<a href="https://natur.cuni.cz/uchazeci/bakalarske-studium/podminky-prijimaciho-rizeni/programy-s-vyukou-v-ceskem-jazyce)," title="https://natur.cuni.cz/uchazeci/bakalarske-studium/podminky-prijimaciho-rizeni/programy-s-vyukou-v-ceskem-jazyce),">natur.cuni.cz/uchazeci/bakalarske-studium/podminky-prijimaciho-rizeni/programy-s-vyukou-v-ceskem-jazyce),</a> je uvedeno dosáhnutí úspěšného řešitele v&nbsp;krajském kole fyzikální olympiády (kategorií A,B,C,D) jako kritérium k&nbsp;upuštění od přijímacích zkoušek. Stránka uvádí:<br /><br />"Účast v&nbsp;příslušném kole olympiády, SOČ a&nbsp;soutěže Eurorebus se dokládá kopií diplomu nebo osvědčení o&nbsp;účasti, příp. kopií potvrzení pořadatele soutěže o&nbsp;účasti v&nbsp;soutěži."<br /><br />Diplom, osvědčení o&nbsp;účasti, či potvrzení pořadatele soutěže o&nbsp;účasti v&nbsp;soutěži jsem emailem ani prezenčně neobdržel a&nbsp;tak se zde chci zeptat, zda si
