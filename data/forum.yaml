- id: 1049
  author: Martin Dlask
  email: martindlask@centrum.cz
  title: Chyba ve vzorovém řešení příkladu 1b) krajského kola kategor
  posted: '2010-05-02 18:40:05'
  who: student
  text: 'Dobrý den,<br />byl jsem řešitelem krajského kola fyzikální olympiády kategorie B, a&nbsp;mám dojem, že vzorové řešení příkladu 1b), které jsem po skončení krajského kola obdržel je špatně.<br /><br />rychlost v5 je uvedena správně, je rovna v5=sqrt(2Hg)/k<br />rychlost v4 je rychlost míčku po odrazu od stropu ve výšce H a&nbsp;musí být o&nbsp;sqrt(2Hg) menší než rychlost těsně před odrazem na zem (míček získá během letu rychlost v4+sqrt(2Hg))<br />můžeme psát:<br />v4+sqrt(2Hg)=v5<br />v4=v5-sqrt(2Hg)                  // vztah pro v4<br />v4^2=(v5^2)-(2*sqrt(2Hg))+2Hg           // vztah pro v4 na druhou<br /><br />a rozhodně to není v4^2=v5^2-2Hg<br /><br />možná někdo z tvůrců řešení zapomněl vzorec pro mocnění součinu a&nbsp;umocnil každý člen zvlášť: (a+b)^2 není a^2+b^2<br /><br />Děkuji, pokud se někdo bude tímto problémem zabývat a&nbsp;hluboce se omlouvám, pokud se mýlím já.'
  children:
  - id: 1050
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Chyba ve vzorovém řešení příkladu 1b) krajského kola kat'
    posted: '2010-05-02 23:05:23'
    who: student
    text: Dobrý den, rychlost sqrt(2Hg) by získal míček, pokud by svůj pohyb začínal z klidu. Jelikož však velikost jeho počáteční rychlosti je nenulová&nbsp;&ndash; v4, získá se velikost jeho výsledné rychlosti těsně před dopadem odmocněním součtu kvadrátů, přesně tak, jak je to ve vzorovém řešení a&nbsp;jak plyne ze zákona zachování energie:<br />1/2*v4^2 = gH + 1/2*v5^2
    children:
    - id: 1051
      author: Martin Dlask
      title: 'Re: Chyba ve vzorovém řešení příkladu 1b) krajského kola kat'
      posted: '2010-05-03 13:55:36'
      who: student
      text: Aha, tak to mě opravdu nenapadlo, že to je řešené přes zákon zachování energie, omluvám se tedy ještě jednou z nařčení, že by se někdo z tvůrců řešení zmýlil.
