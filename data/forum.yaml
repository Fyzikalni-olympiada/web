- id: 1999
  author: Julie Pazdírková
  email: julie.pazdirkova@student.mgvsetin.cz
  title: Kategorie E krajské kolo úloha č. 4 podúloha d)
  posted: '2023-04-27 12:54:13'
  who: student
  text: Dobrý den, chtěla bych napsat ohledně zadání úlohy č. 4 d) kategorie E krajské kolo. V&nbsp;zadání se naskytuje možná alternativa, že drát byl přeštípnutý podélně a&nbsp;ne příčně (i obrázek by tomu odpovídal- náznak přeštípnutí a&nbsp;fakt, že když něco spleteme dohromady délka se zmenší). V&nbsp;tomto případě vychází výsledek úlohy jinak.
  children:
  - id: 2000
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Kategorie E krajské kolo úloha č. 4 podúloha d)'
    posted: '2023-04-27 22:15:25'
    who: student
    text: 'Dobrý den. V&nbsp;zadání se uvádí, že "Petr oba dráty přeštípl v&nbsp;jedné polovině". Ano, pokud Petr tento kovový drát délky 1 m o&nbsp;průměru 0,3 mm podélně rozdělí či doslova přeštípne, pak úloha skutečně vyjde jinak. Ani v&nbsp;jednom z obou obrázků uváděný náznak přeštípnutí nevidím. Souhlasím s&nbsp;tím, že ve spleteném copánku vypadá každý drát delší než polovina původního drátu (tvary vodičů nejsou ve stejném měřítku), ale za rozhodující považuji údaj l/2 v&nbsp;obrázku, kde podle textu je l délka původního drátu. Případná možnost, že l/2 udává délku copánku fyzikálně v&nbsp;úloze nic neurčuje, neboť v&nbsp;jistém rozsahu může být copánek výrazně natažený i&nbsp;výrazně stlačený, což nemá žádný vliv na výsledek.<br />Představy řešitelů jsou někdy nevyzpytatelné a&nbsp;ne vždy se je podaří formulací zadání eliminovat. Přesto nám zachovejte přízeň, váš zájem je pro nás motivace. '
- id: 2001
  author: Kristýna Čábelová
  email: Kristyna.Cabelova@gkolin.cz
  title: Rutil
  posted: '2023-05-03 08:56:38'
  who: ucitel
  text: Dobrý den,<br />chtěla bych zeptat na 2. úlohu z krajského kola kategorie C. Jedná se krystal rutilu. Podle mě ze zadání není jasné, že by krystal byl pravidelný čtyřboký hranol. Je uvedeno, že jde o&nbsp;kvádr a&nbsp;jsou tam jen dva mřížkové parametry a&nbsp;není to zakreslené ani do obrázku. Byla opravdu předpokládána znalost toho, že rutil krystaluje ve čtverečné (tetragonální) krystalové soustavě? Nebo to snad měli usoudit z toho, že to na obrázku vypadá jako pravidelný čtyřboký hranol? Obrázky jsou přece jen ilustrační a&nbsp;snažíme se žákům vštípit, aby nepřisuzovali další vlastnosti, protože to tak na nákresu vypadá. <br />Děkuji K. Č
