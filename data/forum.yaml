- id: 2187
  author: Josef Jírů
  email: josef.jiru@email.cz
  title: Úloha 67A-3-1 Hra s míčem
  posted: '2026-06-28 19:30:57'
  who: ucitel
  text: Na webu je zveřejněno chybné řešení úlohy z celostátního kola, a&nbsp;to v&nbsp;části d). Správně má být v0min = odm(g*(h+odm(h^2+d^2)) = 12,95 m/s (nastane při elevačním úhlu 70,67°). Uváděná geometrická podmínka sin alfa = h/odm(h^2+d^2) vyjadřuje sklon spojnice startu a&nbsp;cíle, nikoliv elevační úhel.<br />Dále v&nbsp;části c) je pro zásah uvedena podmínka, která není obecně dostatečná. Kdyby např. D = 16 m, pak odm(2h/D) < 1, ale odpovídající v0max = odm(g*D) k&nbsp;zásahu nepostačuje, neboť zůstává stále menší než správě určená minimální potřebná rychlost v&nbsp;části d).<br /> <br />
