    posted: '2009-03-12 17:11:43'
    who: student
    text: "Dobrý den, něco málo je napsaáno v&nbsp;organizaním řádu.\r<br />\r<br />Z vítězů celostátního kola se vyberou účastníci výběrového soustředění před IPhO. Počet účastníků je nejvýše deset, počet mladších účastníků pro přípravné soustředění je nejvýše šest. Z nich po skončení soustředění potom ÚK FO vybere pět účastníků IPhO a&nbsp;dva náhradníky.\r<br />\r<br />Pravidla výběru nejsou nikde zakotvena, vybírá se podle výsledků na soustředění a&nbsp;podle výsledku celostátního příp. krajského kola FO."
