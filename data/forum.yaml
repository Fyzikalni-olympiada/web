  author: Řešitel
  title: Hodnocení
  posted: '2020-04-25 15:12:35'
  who: student
  text: Dobrý den, <br /><br />U řešení C1 vám vyšla doba t=23,8 sekund (příklad jste řešili přes dvě rovnice). Já jsem počítal úkol přes jednu rovnici, výsledek jsem zaokrouhlil na 24 sekund (na 2 platné cifry). Výsledek jsem zaokrouhlil na dvě platné cifry, protože v&nbsp;zadání jsou zadaný údaje zaokrouhlené na dvě platné cifry. Mohu dostat za toto bodovou srážku, třeba i&nbsp;půl bodovou?<br /><br />U cvičení C2 body v&nbsp;grafu mám pouze proložený přímkou, v&nbsp;řešení jste body spojili (modrá křivka). Je to chyba, že body nemám spojený?? Mohu dostat bodovou srážku? Mohu dostat bodovou srážku za to, že konstanty úměrnosti mám zaokrouhlené na 2W.s^ -1/2 a&nbsp;2,8 W.m^1/2?<br /><br /><br />Měl bych dostat správně za tyto nedostatky bodovou srážku, třeba i&nbsp;polovinu bodu? Jak by to mělo být?<br /><br />Děkuji<br />
  children:
  - id: 1739
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Hodnocení'
    posted: '2020-04-25 17:33:36'
    who: student
    text: 'Vážený řešiteli, z dotazu cítím Váš velmi kulantně vyjádřený nesouhlas se způsobem zaokrouhlení výsledku. Dovolím si tedy v&nbsp;návaznosti na předchozí diskuzi o&nbsp;zaokrouhlování odpovědět. Obecně posouzení přesnosti výsledku nemusí být jednoduchá záležitost a&nbsp;uváděné pravidlo o&nbsp;počtu platných číslic je jen pravidlem základním. V&nbsp;našem případě je ve jmenovateli rozdíl čísel 3,1-2,7, obě čísla jsou s&nbsp;přesností na 2 platné číslice, ale jejich rozdíl 0,4 má přesnost pouze na jednu platnou číslici. Tedy rozdílem blízkých čísel ve jmenovateli výrazu se nám přesnost výsledku redukuje dokonce na 1 platnou číslici, což implikuje zaokrouhlit výsledek dokonce na 20. Správnost úvahy lze doložit výpočtem. Změřený čas 3,1 s&nbsp;připouští krajní hodnoty 3,06 s&nbsp;a 3,14 s, podobně čas 2,7 s&nbsp;připouští krajní hodnoty 2,66 s&nbsp;a 2,74 s. Když zkombinujeme krajní hodnoty "křížem", tj. do vzorce dosadíme jednou dvojici 3,06 a&nbsp;2,74, podruhé dvojici 3,14 a&nbsp;2,66,
      tak v&nbsp;prvním případě dostaneme výsledek 23,3(!), v&nbsp;druhém případě 14,5 (!). Použité kombinace jsou málo pravděpodobné, jsou to však krajní meze, které reálně nastat mohou. Tedy výsledek 23,8 s&nbsp;zaokrouhlený na 3 platné číslice je jako výsledek matematické úlohy správný, v&nbsp;reálném problému i&nbsp;u&nbsp;výsledku 24 s&nbsp;(2 pl. č.), kde každý vstupní údaj je změřen s&nbsp;nějakou přesností podle zadání úlohy, je nutné číslici na místě jednotek považovat za velmi nejistou.<br />V grafu C2, podle mého názoru, zůstala spojnice bodů omylem. Grafem naměřené závislosti jsou izolované body, které podle průběhu nahrazujeme přímkou nebo vhodnou křivkou.     '
