  posted: '2008-03-11 16:04:17'
  who: student
  text: "V uloze 4. kategorie B je zadaná výhřevnost,která podle tabulek náleží benzinu(v tabulkach to neni napsane, ale asi tam mysli cisty benzin,ne v&nbsp;nejake smesi).My mame spocitat vykon motoru a&nbsp;muzeme si vyjadrit jen hmotnost směsi benzin-vzduch.Tahle smes bude mit ale urcite jinou vyhrevnost nez cisty benzin.Mame se pokusit odhadnout pomer vzduchu a&nbsp;benzinu a&nbsp;pocitat s&nbsp;tim,pripadne z toho spocitat vyhrevnost ty smesi?\r<br />"
  children:
  - id: 858
    author: M. Jarešová
    email: Jaresova.m@seznam.cz
    title: 'Re: B spalovaci motor'
    posted: '2008-03-13 09:06:55'
    who: student
    text: Opravdu se jedná o benzín, údaj o výhřevnosti byl zjištěn ve strojnických tabulkách, kde je přesnější hodnota 42080 kJ/kg. Vzhledem k tomu, že se nevyžaduje úplně přesný výpočet, je v zadání uvedena pouze zaokrouhlená hodnota. V zadání je uveden požadavek výpočtu pouze teoretických hodnot. Hodinová spotřeba paliva se má určit z tepla přivedeného všem čtyřem válcům a z toho pak spočítat za pomoci výhřevnosti spotřebu paliva za hodinu. V úloze se předpokládá pouze přibližný výpočet, při výpočtu se uvažuje pouze benzín. M. Jarešová
