  text: 'Dobrý den, ve studijním textu kategorie C&nbsp;&ndash; přenos tepla jsem na straně 17 možná odhalil menší chybu. V&nbsp;přepsání rovnic (2),(3) a&nbsp;(4) je obsah S&nbsp;nad zlomkovou čarou, tím pádem by při průchodu stejného tepla větší plochou stěny nastala větší změna teploty. Když ale otáčím původní zlomek Q = lambda x S&nbsp;x delta t / d  tak mi vychází S&nbsp;pod zlomkovou čarou: delta t = (Q x d)/(lambda x S) . Je tam chyba, nebo to počítám špatně? Díky za odpověď.'
