  title: Nepřesné zadání
  posted: '2014-02-21 16:13:33'
  who: student
  text: Dobrý den,<br />domnívám se, že zadání prvních dvou úloh domácího kola FO pro kategorii B je nepřesné. V&nbsp;první úloze není řečeno, že kulička je homogenní. Při řešení se to tak nějak automaticky předpokládá, ale jasně zadáno to není a&nbsp;pokud by kulička homohenní nebyla, úloha by měla jiné řešení.<br />U druhé úlohy chybí údaj o&nbsp;zanedbatelné hmotnosti pružiny. Zase se to tak nějak automaticky předpokládá, ale jasně zadáno to není a&nbsp;pokud by nebyla zanedbatelná, museli bychom s&nbsp;ní počítat.
