- id: 439
  author: Tomáš Kafka
  email: tomkafka@email.cz
  title: Obrázky v zadání kategorie B
  posted: '2007-01-23 13:05:46'
  who: student
  text: Dobrý den všem. Řeším kategorii B. U&nbsp;několika úloh mám problém se zadáním. Zadání je jasné do té doby, než se kouknu na obrázek. Tak např. v&nbsp;úloze č.4 o&nbsp;kmitech tělesa zavěšeného na ocelovém laně. Nejprve je napsáno, že drát má délku l_0, potom je na něj zavěšeno závaží, což je ilustrováno obrázkem. Na obrázku je ovšem opět délka lana rovna l_0. K&nbsp;jiné úloze&nbsp;&ndash; 7. Je psáno, že oba válce leží na drsné podložce, což podle mě značí, že na styku každého válce s&nbsp;podložkou bude koeficient tření větší než jedna. Ale v&nbsp;obrázku je koeficient na styku většího válce s&nbsp;podložkou napsán jako f, které máme spočítat. Rozhodl jsem se řídit se čistě zadáním v&nbsp;textu, protože např. v&nbsp;úloze s&nbsp;kmitáním by bez prodloužení nemohly kmity vzniknout.
  children:
  - id: 441
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Obrázky v zadání kategorie B'
    posted: '2007-01-23 15:36:21'
    who: student
    text: "K úloze 4&nbsp;&ndash; máš pravdu, na obrázku by měla být délka drátu těsně před přestřižením vlákna větší než l_0.\r<br />\r<br />K úloze 7&nbsp;&ndash; To, že je podložka drsná, značí pouze to, že f>0. A&nbsp;hodnotu f máš vypočítat. Obrázek je správně. Mezi všemi styčnými plochami je součinitel tření f."
