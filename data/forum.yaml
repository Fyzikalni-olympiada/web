  posted: '2024-01-10 15:45:54'
  who: ucitel
  text: Prosím, odkud se mohou studenti dozvědět cv pro kyslík.<br />Je to 7/2 R?dle úlohy <br /><a href="http://reseneulohy.cz/423/ekviparticni-teorem" title="http://reseneulohy.cz/423/ekviparticni-teorem">reseneulohy.cz/423/ekviparticni-teorem</a><br />Děkuji.<br />Polák
