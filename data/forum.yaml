  posted: '2020-05-27 12:31:49'
  who: student
  text: Dobrý den,<br /><br />chtěl bych se zeptat, jak budete uznávat řešení úlohy číslo 1. V&nbsp;zadání je totiž napsané, že automobil jedoucí ve směru hodinových ručiček má stálou rychlost v_0 (odsud lze z obrázku vydedukovat, že se jedná o&nbsp;automobil jedoucí na okruhu o&nbsp;poloměru r_2). Navíc tam bylo také naznačeno, že automobily jezdí v&nbsp;pravých pruzích, odkud plyne, že označení směrů na obrázku je správné. Tedy jediná správná interpretace by měla být ta, kdy uvažujeme, že "první" automobil je ten, který jede rychlostí v_0 po okruhu s&nbsp;poloměrem r_2 a&nbsp;onen "druhý" automobil má rychlost v&nbsp;a jeho trajektorie má poloměr r_1.<br /><br />Nicméně pod autorským řešením je napsáno, že "V zadání na obrázku v&nbsp;úloze 1 byly špatně označeny směry pohybu automobilů", ale vzhledem k&nbsp;tomu, že existuje (alespoň podle mě) správná interpretace takto zformulovaného zadání, si myslím, že právě ta by měla být uznávána a&nbsp;tedy že je autorské řešení úlohy špatně.<br
    /><br />Můžu se ale mýlit, či jsem mohl něco přehlédnout, nicméně takto to dává smysl i&nbsp;z pohledu laika, který si řekne, že auta jezdí po pravé straně cesty, tudíž by automobil jedoucí ve směru hodinových ručiček měl opravdu jet vpravo.<br /><br />Děkuji předem za odpověď.
