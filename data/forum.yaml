  author: Martin
  email: martram@email.cz
  title: Moment setrvačnosti
  posted: '2009-04-10 16:35:43'
  who: student
  text: 'Dobrý den, prohledal jsem internet i&nbsp;knihovny, ale nikde jsem nenašel řešení svého problému: potřeboval bych vypočítat moment setrvačnosti komolého kužele otáčejícího se kolem osy kolmé na jeho výšku a&nbsp;procházející těžištěm. Bohužel nejsem schopen ani formulovat integrál z něhož by byl takový výpočet možný, natož to pak z něj vypočítat.. Budu moc vděčný za jakoukoli pomoc!'
  children:
  - id: 986
    author: honza hermann
    email: honza.hermann@gmail.com
    title: 'Re: Moment setrvačnosti'
    posted: '2009-04-10 22:42:13'
    who: student
    text: Moment setravačnost disku kolem průměru je mr^2/4. kolem osy rovnoběžné s&nbsp;průměrem a&nbsp;vzdálené d podle steinerovy věty m(r^2/4+d^2). pro komolý kužel výšky v&nbsp;a podstavami s&nbsp;poloměry a, b se spočítá, že těžiště je od podstavy a&nbsp;vzdálené v(a^2+2ab+3b^2)/4(a^2+ab+b^2). No a&nbsp;teď stačí zintegrovat momenty nekonečně tenkých disků. Vyjde něco velmi ošklivého, jestli tě to zajímá, napiš mi na e-mail.
