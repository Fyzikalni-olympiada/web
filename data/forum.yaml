  - id: 805
    author: Honza Prachař
    email: h@matfyz.cz
    title: 'Re: Dvojčočka'
    posted: '2008-01-22 13:17:20'
    who: student
    text: V té úloze se předpokládá, že to světlo z výbojky je koherentní. S tou dvojčočkou to podlě mě nesouvisí.
    children:
    - id: 807
      author: honza hermann
      email: honza.hermann@gmail.com
      title: 'Re: Re: Dvojčočka'
      posted: '2008-01-22 14:32:10'
      who: student
      text: V autorským řešení je doslova uvedeno, že ty dvě ohniska se chovají jako koherentní světelné zdroje. to podle mě neni pravda, paprsky do různých směrů mají různou fázi, protože prošli k&nbsp;ohnisku různě dlouhýma dráhama.
      children:
      - id: 808
        author: Jan Prachař
        email: h@matfyz.cz
        title: 'Re: Re: Re: Dvojčočka'
        posted: '2008-01-22 14:41:12'
        who: student
        text: "\"Koherentní světelné zdroje\" znamená, že světlo z nich může interferovat, mouhou však mít rozdílnou fázi. V&nbsp;řešení se ale předpokládá, že ty zdroje mají stejnou fázi. To je podlě mě pravda, už se symetrie problému.\r<br />\r<br />Jde o&nbsp;to, že se tam fáze pro všechny možné dráhy sečtou a&nbsp;dají výslednou vlnu s&nbsp;nějkou fází a&nbsp;amplitudou. To samé pro druhé ohnisko. Výsledkem jsou koheretní vlny (= schopné interferovat) se stejnou fází a&nbsp;amplitudou."
        children:
        - id: 810
          author: honza hermann
          email: honza.hermann@gmail.com
          title: 'Re: Re: Re: Re: Dvojčočka'
          posted: '2008-01-22 14:59:22'
          who: student
          text: Ok... takže špatné chápání slova koherentní, ale problém zůstává, ne? ty dvě různý dráhy po kterých se světlo může dostat do bodu na stínítku maj různou fázi už v&nbsp;ohniscích.
          children:
          - id: 812
            author: Jakub Marian
            email: kubazek@gmail.com
            title: 'Re: Re: Re: Re: Re: Dvojčočka'
            posted: '2008-01-23 15:06:39'
            who: student
            text: Co říká Fermatův princip? Že světlo z jednoho bodu do jiného se dostane v&nbsp;nejkratším možném čase (což má za "následek" různý ohyb světla apod.). Takže když každá z těch dvou čoček soustřeďuje světlo do jednoho bodu&nbsp;&ndash; obrazu zdroje, znamená to, že po všech možných drahách, po kterých se světlo ze zdroje dostane do tohoto obrazu, musí to světlo letět stejně dlouho... Nebo ne?... Příčinou je pomalejší pohyb světla v&nbsp;čočce...
            children:
            - id: 814
              author: honza hermann
              email: honza.hermann@gmail.com
              title: 'Re: Re: Re: Re: Re: Re: Dvojčočka'
              posted: '2008-01-23 15:30:39'
              who: student
              text: Jo, máš pravdu. pro dokonalou čočku to platí, to je vlastně princip čočky... ale 1) je v&nbsp;zadání, že se tloušťka čočky má zanedbat a&nbsp;2) takhle prostě člověk v&nbsp;FO nepřemejšlí...
            - id: 815
              author: Jan Prachař
              email: h@matfyz.cz
              title: 'Re: Re: Re: Re: Re: Re: Dvojčočka'
              posted: '2008-01-23 15:53:54'
              who: student
              text: "Přesně tak, něco podobného jsem chtěl napsat. Všem drahám přes čočku přísluší stejná fáze. Podobný problém je také například u&nbsp;dvojštěrbiny.\r<br />\r<br />Podstatné je to, že v&nbsp;geometrické \"paprskové\" optice uvažuješ vždycky jen ty paprsky, co mají nejkratší čas.\r<br />\r<br />Tloušťka čočky se měla zanebat vzhledem k&nbsp;ostatním délkám v&nbsp;aparatuře, aby šla použít jednoduchá zobrazovací rovnice. Jinak čočka samozřejmě nějak tlustá být musí, jinak by nefungovala.\r<br />\r<br />"
              children:
              - id: 818
                author: honza hermann
                email: honza.hermann@gmail.com
                title: 'Re: Re: Re: Re: Re: Re: Re: Dvojčočka'
                posted: '2008-01-23 17:46:12'
                who: student
                text: Tak jo, tohle beru :)
            - id: 816
              author: Jan Prachař
              email: h@matfyz.cz
              title: 'Re: Re: Re: Re: Re: Re: Dvojčočka'
              posted: '2008-01-23 15:57:32'
              who: student
              text: Jen bych ještě dodal, že ten nejkratší čas se vždycky bere vzhledem k&nbsp;infinitezimálně blízkým "okolním" paprskům. Jinak by nefungovala difrakce.
            - id: 819
              author: Terka S.
              email: SteinT@seznam.cz
              title: 'Re: Re: Re: Re: Re: Re: Dvojčočka'
              posted: '2008-01-23 19:50:34'
              who: student
              text: 'Podle Fermatova principu je skutečná dráha ta, jejíž nejbližší sousední paprsky sou ve fázi, ne? To může být dráha s&nbsp;nejkratším, ale taky s&nbsp;nejdelším časem...ta kde je derivace casu podle te drahy rovna nule. Treba ve Fykosi uloze XX.VI.2 byl hledany extrem maximum... teda aspon myslim...? '
              children:
              - id: 820
                author: Honza Prachař
                email: h@matfyz.cz
                title: 'Re: Re: Re: Re: Re: Re: Re: Dvojčočka'
                posted: '2008-01-24 10:21:27'
                who: student
                text: Jo máš pravdu, čas musí být extrémální, teoreticky to může být i&nbsp;maximum.
