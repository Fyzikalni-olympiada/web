- id: 1055
  author: Tomáš
  email: t.bellon@seznam.cz
  title: Hmotnost kapdy
  posted: '2010-06-14 17:51:18'
  who: student
  text: Dobrý den, mám dotaz ohledně hmotnosti padající kapky. Prováděli jsme experiment měření povrchového napětí různých kapalin. Připadalo mi, že když kapky z byrety odkapávaly větší rychlostí, tj. kohoutek u&nbsp;byrety byl více otevřený, kapky byly menší a&nbsp;měly tedy menší hmotnost než kapky, které odkapávaly, když byl kohoutek byrety víc přiškrcený. Čemu bych to měl přisoudit? Tření, či tomu, že na kapku působilo větší zrychlení než se stačil povrch kapky přizpůsobit jejímu rostoucímu objemu? Děkuji
  children:
  - id: 1056
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Hmotnost kapdy'
    posted: '2010-06-14 19:54:50'
    who: student
    text: Na velikost kapky má přirozeně vliv rychlost jejího růstu. Voda přitékající do kapky musí v&nbsp;kapce zabrzdit (rychlost vody v&nbsp;byretě je větší než rychlost růstu kapky) a&nbsp;tím vzniká v&nbsp;kapce efektivní tlak. Tomu odpovídá vaše pozorování, že čím rychleji kapka roste, tím jsou kapky menší. Náhlédnout to lze i&nbsp;z Bernoulliho rovnice (pokles rychlosti rovná se vzrůstu tlaku).
