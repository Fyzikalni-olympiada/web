    posted: '2021-02-23 20:33:24'
    who: student
    text: 'Ze zápisu 240 Wh nelze určit, zda obsahuje 2 platné cifry, jak by jinak plynulo ze zápisu 0,24 kWh, nebo 3 pl. c. 0,240 kWh. Pokud chceme v&nbsp;nejednoznačných případech určit počet platných cifer jednoznačně, je třeba údaj uvést v&nbsp;exponenciálním tvaru s&nbsp;první platnou číslicí na místě jednotek, tj. 2,4*10na2 Wh pro 2 pl. c., 2,40*10na2 Wh pro 3 pl. c. Takto se běžně uvádějí fyzikální konstanty, např. G = 6,673*10na-11 N*m2*kg-2.<br />Výsledek a) bych uvedl s&nbsp;dvěma platnými číslicemi, pokud bych z nějakých důvodů použil zlomek, tak bych přidal standartní zápis s&nbsp;jednoznačným počtem pl. c.<br />b) 1 pl. c., protože desítky procent jsou v&nbsp;zadání uvedeny slovem "řádově".<br />Spalovací a&nbsp;elektrický motor&nbsp;&ndash; pro porovnání by to bylo ideální, ale opět musíme respektovat přesnost vstupních údajů.<br />Vyjde-li na kalkulačce celé číslo: Uvedu příklad atleta, který na trati 400 m dosáhl elektronicky změřeného času 50,00 s. Jeho průměrná rychlost
      je v&nbsp;= s/t = 400/50,00 m/s = 8 nebo 8,0 nebo 8,00 nebo 8,000 m/s?<br />Čas je na 4 pl. c., dráha na 3 pl. c., ale jen zdánlivě, přesnost je rozhodně větší než na celé metry. Certifikovaný atletický ovál má délku 400,00 m až 400,04 m (plyne to z požadavku, že skutečná délka trati běžecké disciplíny může být delší až o&nbsp;desetinu promile deklarované délky a&nbsp;nesmí být kratší). To znamená, že dráha bude bezpečně určena také na 4 pl. c. 400,0 m. Z toho plyne rychlost 8,000 m/s, ale vzhledem k&nbsp;fyzikální okolnosti, že atlet není hmotný bod, bych preferoval výsledek 8,00 m/s.<br />Přeji co nejvíce úspěšně vyřešených úloh v&nbsp;roce 2,021*10na3. '
