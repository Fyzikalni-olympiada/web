  posted: '2006-11-26 20:29:14'
  who: student
  text: "Prosím mohli byste mi odpovědět proč má ocel stejnou teplotu jako dřevo(samozřejmě jsou vystaveny stejné teplotě).\r<br />\r<br />\r<br />\t\t\t\t\t\tDěkuji Vám za odpověď\r<br />\t\t\t\t\t\t\t\tMadajová\r<br />"
  children:
  - id: 394
    author: Ríša
    email: risa.student@seznam.cz
    title: 'Re: Dotaz'
    posted: '2006-11-27 19:15:17'
    who: student
    text: 'Zvláštní otázka&nbsp;&ndash; řekněme, že každá soustava se přirozeně snaží přejí do stavu o&nbsp;nejnižší možné energii. Jestliže se ocelový a&nbsp;dřevěný předmět nachází ve stejném prostředí, dojde k&nbsp;tepelné výměně mezi předměty a&nbsp;okolím a&nbsp;obě tělesa získají shodnou teplotu. Pakliže člověk sáhne na tyto dva předměty, zdá se mu ocelový studenější než dřevěný, což může vyvolat dojem, že jejich teplota je rozdílná. Vysvětlení pramení z molekulové struktury látek. Uvažujme obě tělesa v&nbsp;místnosti o&nbsp;teplotě 24°C. Za prvé je dobré si uvědomit, že 24°C je určitě méně než teplota lidského těla (tudíž se nám bude zdát každé těleso v&nbsp;místnosti aspoň trochu chladnější). Za druhé při sáhnutí na ocelové těleso, které je dobrým vodičem (delokalizovaný elektronový systém), se částice velmi rychle ,,shluknou" u&nbsp;tvé ruky a&nbsp;budou od ní chtít získat energii (E je předávána vždy od teplejšího tělesa tělesu studenějšímu&nbsp;&ndash; tj. ocel. těleso- viz předpoklad
      nejnižší energie soustavy na začátku), kdežto u&nbsp;dřeva tento děj nebude probíhat tak rychle, tudíž neucítíš takovou změnu teplot jako u&nbsp;oceli.Tyto schopnosti o&nbsp;hospodaření s&nbsp;teplem vždy popisuje nějaké tepelná kapacita (zde měrná tepelná kapacita c). Jen pro zajímavost: ocel má nízkou c&nbsp;&ndash; rychle se zahřeje a&nbsp;rychle vychladne, dřevo má vysokou c&nbsp;&ndash; pomalu se ohřeje i&nbsp;chladne. Sama můžeš promyslet, zda vzduch má vysokou nebo nízkou c.   '
