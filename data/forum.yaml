  title: Počty úloh domácího kola
  posted: '2015-03-11 07:51:09'
  who: ucitel
  text: 'Dobrý den,<br />prosím o&nbsp;vysvětlení minimálního počtu vyřešených úloh pro postup do vyššího kola. Cituji z pokynů: <br />alespoň pět úloh, které by měly být hodnoceny aspoň 5 body z deseti možných (kategorie EF), v&nbsp;zadání je i&nbsp;experimentální úloha<br /> <br />alespoň pět úloh a&nbsp;řešení (i třeba neúspěšně) zadané experimentální úlohy (kategorie ABCD)<br /><br />Znamená to, že musí být 5 + 1 (experimentání) nebo 5 (a v&nbsp;tomto počtu už je ta experimentální obsažena)?<br />Děkuji za odpověď, M. Goldová'
