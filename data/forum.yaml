- id: 56
  author: Josef
  email: jbednar@ppfbanka.cz
  title: Mouchy v papiňáku
  posted: '2005-01-20 14:05:55'
  who: student
  text: Vezměme, že v&nbsp;papiňáku položeném na váze chaoticky poletují mouchy. Co se stane s&nbsp;ručičkou váhy, když mouchy naráz usednou na dno? Předpokládám, že se ručička vychýlí a&nbsp;posléze ustálí na původní hodnotě. Tíha podle mne zůstane stejná?(vezmemeli, že g je stejné všude v&nbsp;hrnci) Může to někdo potvrdit anebo vyvrátit? Děkuji
  children:
  - id: 57
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Mouchy v papiňáku'
    posted: '2005-01-20 19:12:10'
    who: student
    text: "Pokud je papiňák uzavřený je situace jednoduchá. Váha samořejmě váží veškerou hmotu na ni položenou (papiňák, vzduch v&nbsp;papiňáku i&nbsp;mouchy). To, že na váhu působí i&nbsp;tíha vzduchu v&nbsp;hrnci, lze zdůvodnit rozdílem tlaků vzduchu na dno a&nbsp;na víko papiňáku.\r<BR>\r<BR>Na váhu působí samořejmě i&nbsp;tíha much. Aby se moucha udržela v&nbsp;klidu ve vzduchu, musí na vzduch působit silou, která se rovná tíze mouchy. Jestliže jsou tedy mouchy v&nbsp;klidu, ukazuje váha stejně, ať letí ve vzduchu, nebo sedí ne dně.\r<BR>\r<BR>Pokud mouchy poletují, bude ručička vah nepatrně kmitat. Když se tedy všechny poletující mouchy rozhodnou sednout na dno, vychýlí se ručička k&nbsp;nižším hodnotám a&nbsp;pak se ustálí na původní hodnotě.\r<BR>\r<BR>Pokud je papiňák otevřený, jedná se o&nbsp;složitý problém mechaniky kontinua. V&nbsp;zásadě však můžeme říci, že se hodnota ukazovaná váhou bude spojitě měnit od součtu tíhy hrnce a&nbsp;much k&nbsp;tíze samotného hrnce podle toho,\
      \ jak mnoho much je na cestě z hrnce."
