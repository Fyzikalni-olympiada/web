    who: student
    text: "<ol>\r\n<li>V&nbsp;rovnici vypadlo rovnítko, má být <var>m</var><sub>2</sub><var>a</var><sub>2</sub> = 2<var>m</var><sub>2</sub><var>a</var><sub>1</sub> = <var>T</var>&nbsp;&minus;&nbsp;<var>m</var><sub>2</sub><var>g</var>.</li><li>Tvrzení je pravdivé, neboť válec se otáčí kolem bodu dotýkajícího se podložky&nbsp;&ndash; tento bod je vůči podložce v&nbsp;klidu. Vzhledem k&nbsp;tomu, že je válec tuhý, můžeme počítat s&nbsp;konstantním úhlovým zrychlením <var>&epsilon;</var>, a&nbsp;tudíž v&nbsp;každém okamžiku platí <var>a</var><sub>1</sub> = <var>&epsilon;r</var> a a<sub>2</sub> = <var>&epsilon;</var>&nbsp;&middot;&nbsp;2<var>r</var></li></ol>"
