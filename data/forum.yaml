  - id: 1410
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: Počty úloh domácího kola'
    posted: '2015-03-11 10:40:15'
    who: ucitel
    text: Ve všech zmíněných kategoriích je třeba pro postup do vyššího kola vyřešit alespoň pět libovolných úloh za alespoň pět bodů a&nbsp;vyřešit experimentální úlohu (tj. odevzdat řešení, na počtu bodů nezáleží).
