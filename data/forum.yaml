  text: 'Dobrý den, v&nbsp;Čl. 5 Úkoly soutěžících organizačního řádu je v&nbsp;bodu 1 napsáno: „Úkolem soutěžících je samostatně vyřešit úlohy daného soutěžního kola. Řešení úloh (dále jen „protokoly“) musí soutěžící zapsat tak, aby bylo možné sledovat jejich myšlenkový postup.“ Zajímalo by mě tedy, zda je nutné uvádět slovní vysvětlení, či stačí, aby bylo patrné postupné využívání a&nbsp;dosahování vzorců atd…'
