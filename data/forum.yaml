  text: 'Prosím, opravte vzorové řešení. Vzhledem k&nbsp;tomu, že v&nbsp;zadání úlohy je uvedeno, že tření se má zanedbat a&nbsp;není specifikováno kdy, je nutné ho zanedbat ve všech bodech úlohy a&nbsp;kulička po nakloněné rovině se tedy nemůže kutálet ale pouze smýkat s&nbsp;nulovým třením. '
