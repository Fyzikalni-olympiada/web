  email: jmichalek@seznam.cz
  title: Experimentální úloha, kat. A
  posted: '2008-03-08 11:10:51'
  who: ucitel
  text: Při zpracování dat měření se výsledek uvádí ve tvaru nějakého intervalu a&nbsp;spolehlivosti (většinou 68,3 %), přičemž vycházíme z náhodnosti rozložení chyby. Šířku intervalu určuje Studentův součinitel (pro pět měření 1,15; pro deset měření 1,06) násobený výběrovou směrodatnou odchylkou aritmetického průměru. Udáváme-li výsledek měření ve tvaru průměr plus minus směrodatná odchylka, máme pravděpodobnost, že veličina spadá do tohoto intervalu menší než padesát procent (lze přesně vypočítat). Z definice pravděpodobnosti dostane asi půlka soutěžících interval zahrnující neznámou hodnotu, zbytek dostane příliš malý interval. Toto rozdělení je zcela náhodné, a&nbsp;přesto se započítává do hodnocení experimentální úlohy.
  children:
  - id: 852
    author: P. Šedivý
    email: premysls@seznam.cz
    title: 'Re: Experimentální úloha, kat. A'
    posted: '2008-03-09 11:06:10'
    who: ucitel
    text: "Milý Jakube,\r<br />\r<br />při hodnocení experimentální úlohy jsme si samozřejmě uvědomovali, že skutečná hodnota bude  ležet v  intervalu určeném výpočtem jen s určitou pravděpodobností. V tomto směru jsme při opravování\r<br />byli velmi benevolentní.\r<br />Šlo hlavně o to, aby řešitelé provedli správně  předepsané výpočty s naměřenými hodnotami. Pouze ve dvou případech odhalilo porovnání skutečné hodnoty s výsledky výpočtů, že řešitel se při měření výchylek  dopustil hrubé systematické chyby, což jsme ohodnotili bodovou srážkou.\r<br />\r<br />S pozdravem\r<br />\r<br />P. Šedivý "
- id: 851
  author: M. Rost
  email: neplatny@nic.cz
  title: Internet v Kategoriích E,F
  posted: '2008-03-09 09:31:04'
  who: student
  text: " Nevím, nebo spíše nechápu, proč v&nbsp;posledním ročníku kategorie E,F je nutno v&nbsp;5 příkladech pracovat s&nbsp;informacemi z internetu. Podle mě to člověka značně zpomaluje při řešení jinak naprosto jednoduchých úloh (samozřejmě jak pro koho, chápu že domácí kolo je určeno pro dva ročníky). Příklady naprosto nepočítají s&nbsp;lidmi, kteří nemají k&nbsp;internetu přístup, nebo možnost si program Google Earth stáhnout. Já osobně si ho dokonce ani nemohu nainstalovat, protože používám OS Linux (jejich údajná linux instalační verze nefunguje a&nbsp;zdrojový kód neposkytli k&nbsp;dispozici). Nicméně chyba vzniklá měřením v&nbsp;tomto programu je dost radikální a&nbsp;pohybuje se v&nbsp;desítkách až stovkách metrů. Podle mě by úlohy měly být hodnoceny s&nbsp;ohledem na schopnosti žáků/studentů v&nbsp;oboru fyziky a&nbsp;nikoliv jim poskytovat nebo ubírat body za věci které s&nbsp;tím naprosto nesouvisí.\r<br />\r<br /> Jinak k&nbsp;tomuto fóru... Rozhodně jsem nepostřehl důvod proč\
    \ je položka email povinná a&nbsp;rozhodně vám svůj email poskytovat nehodlám."
  children:
  - id: 854
    author: honza hermann
    email: honza.hermann@gmail.com
    title: 'Re: Internet v Kategoriích E,F'
    posted: '2008-03-09 13:13:34'
    who: student
    text: Jenže s&nbsp;fyzikou na základoškolský úrovni je ten problém, že v&nbsp;ní není téměř žádná matematika. takže když chce olympiáda mít úlohy odlišný od těch školských, musí jít jiným směrem, než na vyšších úrovních. imho
  - id: 856
    author: Prof. RNDr. Ivo Volf, CSc.
    email: ivo.volf@uhk.cz
    title: 'Re: Internet v Kategoriích E,F'
    posted: '2008-03-09 13:45:58'
    who: student
    text: "Milý neznámý,\r\n<br />nejprve k&nbsp;tomu emailu. Když ho neuvádíš, je to jakobys nám psal jako anonym, vyhýbal se kontaktu a&nbsp;styděl se za svůj názor. Já ti svůj email klidně sdělím a&nbsp;přidám i&nbsp;adresu na pracoviště. Ale teď k&nbsp;úlohám. \r\n<br />Já naopak jsem velmi rád, že se mi podařilo vymyslet úlohy, při jejichž řešení (či jako doplněk k&nbsp;řešení) se použije internet. Většina lidí na počítači hraje hry a&nbsp;střílečky, a&nbsp;teď najednou se mohou podívat třeba do Sao Paula v&nbsp;Brazílii a&nbsp;porovnat, zda tvrzení pilotů o&nbsp;tom, že nemuselo dojít vloni k&nbsp;velkému neštěstí, kdyby se nepřistávalo na městském letišti, je oprávněné. Taky nabádám tím žáky, aby i&nbsp;pro zeměpis hledali nové přístupy v&nbsp;družicových snímcích. Google Earth 3D lze stáhnout zdarma a&nbsp;obsahuje milióny zajímavých informací, propojení na Wikipedii a&nbsp;nesčetně fotografií. Navíc úlohy jsou konstruovány tak, že hledání na internetu je mnohdy jen nadstavbou nad\
      \ pěti body, které je nutno získat při správném řešení každé úlohy ve fyzikální olympiádě. A&nbsp;ještě jedna věc: v&nbsp;prvním kole (které se řeší doma, ale škola by měla napomoci řešitelům při experimentální úloze a&nbsp;nyní i&nbsp;při využití internetu) je tolik úloh, že učitel fyziky může&nbsp;&ndash; podle možností svých žáků&nbsp;&ndash; vybrat i&nbsp;další úlohy, které je možno řešit. Já to vidím tak, že řešitel by mohl protestovat, proč musí kreslit ve více úlohách grafy, proč musí ve více úlohách počítat, používat kalkulačku aj. \r\n<br />Zdraví a&nbsp;mnoho chuti do řešení úloh s&nbsp;informacemi z internetu přeje Prof. Volf"
