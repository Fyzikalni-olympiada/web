    who: student
    text: Dobrý den. Části a), b), c) se týkají sériového zapojení, část d) paralelního zapojení. Vložená věta o&nbsp;paralelním zapojení měla být zahrnuta jako první věta do části d). Hledaným proudem se rozumí celkový proud, tj. proud tekoucí nevětvenou částí zapojení. Za nejasnost se omlouváme a&nbsp;přejeme úspěšné vyřešení.
