- id: 2160
  author: Samuel Probst
  email: probstsamuel@gmail.com
  title: Zaoukruhlovani
  posted: '2026-03-22 19:24:21'
  who: student
  text: Kdyz mi v&nbsp;uloze vyjde treba uhel 12.34567 a&nbsp;neni specifikovano na kolik desetinnych mist mam zaokruhlovat. Na kolik desetinnych mist mam zaokruhlit?
  children:
  - id: 2161
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Zaoukruhlovani'
    posted: '2026-03-22 23:03:04'
    who: student
    text: Obvykle je při zaokrouhlování rozhodující počet platných číslic. Např. délka 234,567 cm zaokrouhlená na dvě desetinná místa je 234,57 cm, ale stejná délka 0,002 345 67 km zaokrouhlená opět na dvě desetinná místa je 0,00 km. Zatímco po zaokrouhlení na 2 pl. č. dostáváme rovnost 230 cm = 0,002 3 km, tedy obě zaokrouhlené hodnoty mají stejnou přesnost.<br />Při výpočtech (násobení, dělení, umocňování, odmocňování a&nbsp;jejich kombinace) základní pravidlo je, že konečný výsledek nemůže být uveden na větší počet pl. č., než je minimální počet pl. č. čísel vstupujících do výpočtu. Např. včera zlatá medailistka Gloria Manuel zaběhla 400 m asi za 51 s, spočteme její průměrnou rychlost. Vzdálenost 400 m je ve skutečnosti 400,0 m (myslím, že dle pravidel atletiky je v&nbsp;toleranci změřené rozmezí 400,00 m až 400,04 m), tedy bezpečně 4 pl. č. (stovky, desítky, jednotky, desetiny), uvedený čas 51 s&nbsp;má však jen 2 pl. č. Její průměrná rychlost byla v&nbsp;= s/t = 400,0 m / 51 s&nbsp;=
      7,8 m/s, ne přesněji. Teprve když si vyhledáme oficiální výsledkovou listinu s&nbsp;časem 50,76 s, pak můžeme na základě stejného výpočtu tvrdit, že její průměrná rychlost byla 7,880 m/s.<br />Ještě pozor na rozdíl blízkých čísel. Naměříme-li posuvným měřidlem vnější průměr zkumavky 1,66 cm a&nbsp;vnitřní průměr 1,48 cm, pak tloušťka skla je (1,66&nbsp;&ndash; 1,48) cm / 2 = 0,09 cm = 0,9 mm ... a&nbsp;najednou máme ze tří platných číslic pouze jednu platnou číslici.<br />Tak hodně štěstí, nejen při zaokrouhlování!<br />
