      text: Super, jsem rád, že učitelské diskuse se účastní jen učitelé !<br />Ale reakce není svou podstatou úplně mimo, tak navzdory její "kultivovanosti" zareaguju.<br />Ano, učitelé, kteří se fyzikálním talentům úspěšně věnují, jsou odměňováni z projektu Excelence (spíše však až na SŠ úrovni) a&nbsp;je to pro ně motivace, tedy dobře. Hlavní díl práce je ale na samotných žácích (a je to logické&nbsp;&ndash; pro ně je soutěž určena a&nbsp;jim má pomoci stát se lepšími fyziky), takže i&nbsp;oni by měli být odměňováni více než poukázkou v&nbsp;hodnotě cca 500 Kč. (Chtě nechtě v&nbsp;tržní společnosti je finanční odměna často až na prvním místě.) A&nbsp;chtěl-li by někdo argumentovat, kde na to vzít peníze, stačí se podívat na prostředky, kterými disponují projekty Erasmus. Asi by bylo potřeba se na patřičných místech znovu podívat na to, které aktivity jsou pro budoucnost našich žáků přínosné a&nbsp;finanční toky trochu přerozdělit. Kdo s&nbsp;tím můžete něco udělat, zkuste se nad tím prosím
        zamyslet !
