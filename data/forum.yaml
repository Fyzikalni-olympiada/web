  text: "Domácí pokus: Na tužce stoč ocelový drátek (délky asi 60 cm, průměru 0,3 mm ). Zapoj stočený drátek do obvodu s&nbsp;plochou baterií a&nbsp;žárovkou. Drátek zahřívej (např. svíčkou). Pozoruj jas žárovky a&nbsp;pozorovaný jev vysvětli.                                       \r<br />TAK TAKHLE ZNÍ MŮJ DÚ Z FYZIKY PORADÍTE MI PROSÍM NĚKDO DĚKUJI Týna moc moc vám děkuji předem je to nutný :-( :-(  :-)"
  children:
  - id: 271
    author: Ríša
    email: risa.student@seznam.cz
    title: 'Re: SOS lidičky poraďtě please'
    posted: '2006-03-25 16:55:04'
    who: student
    text: 'Když namotáš na tužku drát, vznikne ti rezistor neboli spotřebič. Jak je známo při rostoucí teplotě se zvětšuje odpor rezistoru, tedy i&nbsp;drátku a&nbsp;jas žárovky bude ubývat. Odpor při teplotě 0°C vypočítáš jako R=ql/S, kde q je rezistivita oceli, l délka vodiče a&nbsp;S obsah průřezu. Jestliže zvýšíš teplotu z t0 na t, bude nový odpor: R´=R[1 + @(t-t0)], kde @ je teplotní součinitel el. odporu.(vit MFChT)'
