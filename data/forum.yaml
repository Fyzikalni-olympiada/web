  author: David Holiš
  email: david.632@centrum.cz
  title: Fyzikální olympiáda
  posted: '2007-04-11 09:36:45'
  who: ucitel
  text: "Přeju hodně zdaru Vaší práci,\r<br />ale vzhledem k&nbsp;ostatním soutěžím se mi fyzika (E, F) zdá pro žáky dost obtížná a&nbsp;nezajímavá.(Jako učitel ji dělám už 9 let a&nbsp;v&nbsp;okrese sbíráme většinou s&nbsp;děckama medaile.) Určitě by to šlo nějak oživit: test, křížovka, pokus ... Počítat 4 hodiny 4 příklady je \"maso\"!Do okresu musíme dojet a&nbsp;pokud je děcko z vesnice, tak vstává po 5. hodině, a&nbsp;pak 4 hodiny počítat?! Stačí se podívat na účast, která je rok od roku slabší. Vím, je to práce navíc, děláme to zadarmo, ale děcka a&nbsp;i mě to už přestává bavit. Tak hodně štěstí všem v&nbsp;dalších ročnících. "
  children:
  - id: 717
    author: Ivo Volf
    email: ivo.volf@uhk.cz
    title: 'Re: Fyzikální olympiáda'
    posted: '2007-07-14 16:56:50'
    who: ucitel
    text: "Děkuji za zprávu. Je to opravdu slovo do diskuse. Mně osobně trápí již několik let, že účast v&nbsp;nejnižších kategoriích se tak silně zmenšila, i&nbsp;když to zase tragické není. Spočítejte si třeba, kolik žáků z vaší školy se účastní okresního přeboru ve volejbalu nebo v&nbsp;golfu, kolik se jich účastní krajského přeboru žáků v&nbsp;šachu nebo ve skoku vysokém, a&nbsp;najednou zjistíte, že to není nic moc.  Spíše jste mě překvapil s&nbsp;hodnocením kvality a&nbsp;zajímavosti úloh. Já jsem byl třeba v&nbsp;tomto roce hrdý na to, jaké úlohy se objevily v&nbsp;kategoriích EF&nbsp;&ndash; šlo o&nbsp;úlohy nejen originální, ale se zcela jiným přístupem. Podařilo se mi zařadit úlohy s&nbsp;počítačem, a&nbsp;to tu ještě nebylo. Vyčítali mi, že jsou to úlohy příliš zeměpisné&nbsp;&ndash; ale geografie a&nbsp;geofyzika mají k&nbsp;fyzice blízko. A&nbsp;navíc&nbsp;&ndash; fyzika se nedělá kvůli fyzice, ale především kvůli možným aplikacím, a&nbsp;ty je třeba hledat všude kolem nás.\
      \ A&nbsp;že jsou úlohy obtížné&nbsp;&ndash; pravda, jsou. Ale neobtížné, tedy lehké úlohy nejsou nic pro fyzikální olympioniky&nbsp;&ndash; přece ve skoku do dálky se také neskáče jen metr daleko, ale jde se po rekordech. Spíše mně trápí, že si učitelé již nenacházejí čas k&nbsp;tomu, aby se jednou za dva či tři týdny na hodinku setkali se svými žáky&nbsp;&ndash; zájemci o&nbsp;fyziku, aby s&nbsp;nimi probrali návodné úlohy k&nbsp;řešení FO. Protože jsem taky vyučoval na škole a&nbsp;měl jsem ve třídě čtyři úspěšné účastníky celostátního kola (už je to však dávno, ba hrozně dávno), budoucí matfyzáky, vím, že se to vyplatí&nbsp;&ndash; ne sice finančně, ale učitel má radost ze svých úspěšných žáků. Pokud se vám úlohy zdají opravdu obtížné a&nbsp;málo zajímavé, pošlete mi vaše vlastní úlohy, které budou zajímavé a&nbsp;dosti lehké, přesto však pro olympioniky. Adresu vám píšu (ale je v&nbsp;každém letáku FO): ivo.volf@uhk.cz . Budu se těšit na vaše další připomínky, ale především na\
      \ vaše úlohy. Kritika je vždycky nepříjemná, ale užitečná. Aktivní kritika doprovázená nápravným opotřením je vítaná a&nbsp;moc bych byl za ni vděčný. \r<br />S pozdravem IV, který se FO věnuje již více než 45 let."
