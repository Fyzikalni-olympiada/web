- id: 1770
  author: Mgr. Jiří Holubička
  email: holubicka@gozhorice.cz
  title: Organizace kategorie E a F
  posted: '2020-09-09 14:50:44'
  who: ucitel
  text: Dobrý den,<br />na poměrně rozsáhlý příspěvek kolegy Křečka zde reagováno nebylo, proto se k&nbsp;tématu také vyjádřím.<br />Se změnou termínů v&nbsp;těchto kategoriích též zásadně nesouhlasím, řešitelů FO není nijak mnoho a&nbsp;exponovaný termín konce 1. pol. může jejich počet jen dále zmenšit. Pro potřeby přijímacích řízení by přece bohatě stačila informace, že žák FO řeší (nebo jeho loňský výsledek z kategorie F). Forma je samozřejmě k&nbsp;diskusi, ale má-li FO na úrovni ZŠ připravit úspěšné řešitele vyšších kategorií, nic špatného na její podobě nevidím (kromě toho, že spousta ZŠ se v&nbsp;dnešní době této úrovni už ani nepřiblíží, ale to je na jinou diskusi). Rád bych tedy (z pozice "šéfa" FO v&nbsp;okrese Jičín) co nejdůrazněji požádal o&nbsp;návrat dřívější organizační struktury a&nbsp;zároveň o&nbsp;výrazné navýšení odměn pro nejlepší řešitele, aby se posílila motivace žáků k&nbsp;účasti. O&nbsp;důležitosti fyziky a&nbsp;návazných technických profesí se neustále mluví,
    ale podle mého názoru se nic moc pro zvýšení motivace žáků do tohoto směru vzdělání nedělá.<br />V současné "zavirované" době se může zdát tento podnět jako zbytečný, ale myslím si že naopak&nbsp;&ndash; právě teď může být vhodný čas na různé diskuse a&nbsp;změny.<br />Prosím tedy o&nbsp;názory ostatních a&nbsp;hlavně o&nbsp;to, aby se naše "stížnost" dostala k&nbsp;těm, kteří o&nbsp;termínech soutěží rozhodují.<br />Předem děkuji, s&nbsp;pozdravem a&nbsp;přáním pevného zdraví <br />Jiří Holubička, Zemědělská akademie a&nbsp;Gymnázium Hořice
