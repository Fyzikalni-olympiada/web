- id: 1989
  author: Zdeněk Polák
  email: polak@gymnachod.cz
  title: Unesu vzduch za místnosti v igelitovém pytli? (FO64E2-2)
  posted: '2023-03-27 16:07:01'
  who: ucitel
  text: Vzhledem k&nbsp;tomu, že není řečeno jak moc stlačen vzduch bude, protože igelitový pytel není ocelová lahev, troufám si říci, že i&nbsp;netrénovaný člověk vzduch unese. (Otázka je, kolik by takový pytel vážil sám o&nbsp;sobě.)<br />Dokonce jsem si myslím, že takto byla snad původně úloha zamýšlena, ne? Neměli by žáci takto uvažující dostat naopak nějaký bonusový bod navíc?
  children:
  - id: 1990
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: Unesu vzduch za místnosti v igelitovém pytli? (FO64E2-2)'
    posted: '2023-03-28 09:11:41'
    who: ucitel
    text: Dobrý den, pane Polák,<br /><br />podúloha o&nbsp;tom, jestli je možné vzduch unést, se mi zdá jako nesmyslná. Jak správně píšete, je třeba započítat hmotnost pytle, resp. nádoby, ve které vzduch bude. A&nbsp;také odečíst vztlakovou sílu. Čím více vzduch stlačíme, tím menší bude vztlaková síla, a&nbsp;tím více budeme muset mít odolnější nádobu. Pokud by se jednalo o&nbsp;opravdu velký pytel s&nbsp;objemem asi 2000 litrů, měl by vzduch tlak 10 MPa (100 barů). Běžně se ocelové tlakové nádoby dělají do tlaku 10 až 20 bar :-) <br /><br />Dále rozhodně nejde srovnávat zvedání činky ze země nad hlavu a&nbsp;nesení pytle, což například dokládá světový rekord v&nbsp;přenášení jha na 10 metrů, který <a href="https://www.reddit.com/r/interestingasfuck/comments/2wbccg/world_record_555kg_1223lb_yoke_walk/">je 555 kg</a>.
