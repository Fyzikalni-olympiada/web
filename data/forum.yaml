        title: Příprava na Archimédiádu
        posted: '2013-11-28 10:03:08'
        who: ucitel
        text: Úkolem Archimédiády není ani tak moc soutěžení, ale spíše nacházení dobrého vztahu k&nbsp;fyzice. Jde tedy spíše o&nbsp;objevování fyziky tam, kde není běžně vidět, hledání fyziky kolem nás, nejen tedy ve školních hodinách fyziky. <br />Pokud se chcete připravovat na úlohy z Archimédiády, propočítávejte se úlohy z minulých let, které najdete <a href="http://fyzikalniolympiada.cz/archiv/zadani-a-reseni">v&nbsp;archivu</a>. Archimédiáda jako soutěžní kategorie zahajuje až 1.února. <br />Všem hodně dobrých nápadů a&nbsp;úžasné výsledky přeje Ivo Volf, předseda.
