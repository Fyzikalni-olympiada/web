- id: 1096
  author: Kristína
  email: krisnesporova@gmail.com
  title: Kat B, př. 6
  posted: '2010-10-28 09:17:04'
  who: student
  text: Dobrý den.<br />Ráda bych se zeptala, zda v&nbsp;úloze 6 kategorie B patří opravdu tato věta:<br />"V grafu závislosti teploty termistoru na odporu proveďte polynomickou regresi 4. stupně..."<br />Tato závislost totiž podle regrese polynom 4. stupně být nemůže. Podle datasheetu k&nbsp;použitému termistoru jde o&nbsp;inverzní funkci k&nbsp;polynomu 3. stupně, což na naměřené hodnoty sedí velmi dobře.<br />Děkuji za odpověď.
  children:
  - id: 1097
    author: Přemysl Šedivý
    title: 'Re: Kat B, př. 6'
    posted: '2010-10-28 12:45:24'
    who: student
    text: V první části úlohy jde o&nbsp;co nejpřesnější určení teploty termistoru jako funkce jeho odporu. Pokud vyhovuje lépe jiná než doporučená regrese, doporučuji ji použít s&nbsp;příslušným komentářem.
    children:
    - id: 1098
      author: Kristína
      email: krisnesporova@gmail.com
      title: 'Re: Kat B, př. 6'
      posted: '2010-10-28 13:12:01'
      who: student
      text: Dobrý den.<br />Jiná regrese by určitě vyhovovala lépe.<br />Po 25 měřeních mi gnuplot spočítal v&nbsp;polynomu 4. stupně koeficienty tak, že regresní křivka vychází následovně (na vodorovné ose je odpor v&nbsp;kiloohmech, na svislé teplota ve stupních celsia), což mi nepřipadá reálné:<br /><a href="http://yfrog.com/73abcdkp" title="http://yfrog.com/73abcdkp">yfrog.com/73abcdkp</a>
      children:
      - id: 1101
        author: Přemysl Šdivý
        email: premysls@seznam.cz
        title: 'Re: Kat B, př. 6'
        posted: '2010-12-08 14:59:00'
        who: student
        text: Polynom 4. stupně může vystihnout průběh závislosti  tohoto typu jen v&nbsp;určitém omezeném intervalu, ve kterém jsme provedli měření. Jakmile hodnotu odporu dosazovanou do vzorce budeme  zmenšovat nebo zvětšovat mimo tento interval, funkce od určitého bodu nutně poroste k&nbsp;nekonečnu a&nbsp;přestane odpovídat vlastnostem součástky.<br />P. Šedivý
