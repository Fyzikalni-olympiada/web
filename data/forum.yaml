  author: Jitka Kubicová
  email: jitka59kubicova@gmail.com
  title: Fyzikální olympiáda 2020/2021
  posted: '2020-10-20 03:49:47'
  who: student
  text: Dobrý den milí kolegové, učitelé fyziky a&nbsp;dobrý den organizátoři domácích, okresních, krajských i&nbsp;celostátních kol FO. <br /><br />Ráda bych se zeptala, jak to vypadá s&nbsp;letošním ročníkem 2020/2021 fyzikální olympiády. Jsem letitou nadšenkyní této olympiády. Vždy mi připadala spočitatelná a&nbsp;čitelná. A&nbsp;i&nbsp;když příkladů bylo mnoho, vždy jsem se věnovala dalším žákům a&nbsp;studentům, pro které to byla nová výzva jejich života. <br />Vím, že žíjeme nyní ve světě, který je řízen mrňavým koronavirem, který nám ničí ekonomiku, krásy života i&nbsp;jeho pestrost. Přesto bych chtěla oslovit širokou veřejnost nadšenců FO. <br />Pojďme se domluvit, že tuto krásnou soutěž nenecháme padnout! Děti jsou zmotivovány. Chtějí. Pojďme vymyslet domácí kolo. Lépe řečeno, vy, co to děláváte, vymyslete ho a&nbsp;už nám ho tam dejte, prosím.<br />A pokud nás ta mrňavá potvůrka bude trápit ještě na jaro, vymysleme distanční řešení úloh okresního kola, či rozestupy žáků a&nbsp;studentů
    ve třídách na 4 hodiny tak, aby nebyli ohroženi. Pokud se ztrácí podpora z ministerstva, budu opravovat okresní kolo i&nbsp;bez finanční odměny. Jen, prosím, nenechejme tuto krásnou soutěž usnou a&nbsp;vytratit se z našich životů. <br />Děti se rodí stále nové, nepopsané, ale takové, že chtějí. že je to zajímá a&nbsp;že je to baví. <br /><br />Nevzdávejme to, dejme se do kupy a&nbsp;najděme cestu, jak FO nenechat usnout!<br /><br />Jitka Kubicová,<br />milovnice FO, bývalá debrujárka a&nbsp;tichá učitelka fyziky
