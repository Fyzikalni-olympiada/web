  - id: 266
    author: Jan Prachař
    email: h@matfyz.cz
    title: 'Re: Potreboval bych poradit'
    posted: '2006-03-05 23:22:01'
    who: student
    text: "Ríša má pravdu v&nbsp;tom, že vertikální složka zrychlení tělesa je g.\r<br />\r<br />Co se týče časové závislosti tečného zrychlení na čase, víš, že platí a&nbsp;= g\\sin\\alpha, a&nbsp;= R\\epsilon. Jelikož úhlové zrychlení je druhá časová derivace úhlové polohy podle času, dostaneš diferenciální rovnici\r<br />\r<br />R \\alpha'' = g\\sin\\alpha.\r<br />\r<br />Tuhle rovnici lze jednoduše vyřešit jen pro malé \\alpha, kdy přibližně platí \\sin\\alpha=\\alpha, pak je řešením exponenciální závislost."
