  title: Autorské řešení
  posted: '2007-01-15 06:31:36'
  who: student
  text: Je možné, že by v&nbsp;autorském řešení byly chyby? Já když jsem ho viděl, tak se domnívám že tam jsou. Jedná se o&nbsp;příklad 4 kat. A. podle mě je tam chybně napětí a&nbsp;proud u2. chybí to vynásobit mínusem. Díky tomu jsou tam pak blbě i&nbsp;tyto grafy. A&nbsp;myslím si že i&nbsp;Jaulovo teplo (Ale to jsem aztím nezkoumal) JInak ten proud a&nbsp;naětí si myslím že je blbě, jelikož je to v&nbsp;rozporu se 2 zdroji ze kterých jsem čerpal (Fyzika&nbsp;&ndash; VUT Brno a&nbsp;http://falstad.com/circuit/index.html)
  children:
  - id: 443
    author: Marek Basovník
    email: rughar@gmail.com
    title: 'Re: Autorské řešení'
    posted: '2007-01-23 17:48:12'
    who: student
    text: Podle mě je "chyby" příliš silné slovo. Záleží na tom, jak se na situaci podíváš. Ty bereš napětí jako rozdíl potenciálů desek kondenzátorů v&nbsp;nějakém konkrétním kruhovém směru (obvykle se to tak dělá), ale autoři berou napětí v&nbsp;oriantaci směrem od země (todle se ale taky dělá). Je to úplně jedno, obojí zobrazení je dobře. To autorské s&nbsp;orientací od země mě třeba příde simpatičtější než to tvé v&nbsp;s&nbsp;orientací v&nbsp;kruhu. Ale tak jde jen o&nbsp;pohled. Podstata je ve tvém i&nbsp;v&nbsp;autorském řešení stejná. Desky kondenzátorů, které jsou napojeny na zem nabývají nulového potenciálu a&nbsp;na deskách, které jsou napojeny na cívku se přelévá náboj, takže v&nbsp;počáteční fázi je první kondenzátor "v podstatě" na tom stejně jako druhý po uplynutí poloviny periody. Na tom se všichni určitě shodnem. Jestli pak druhé napětí budeš mít kladné a&nbsp;budeš jej odčítat a&nbsp;nebo záporné a&nbsp;budeš jej sčítat, je to úplně to samé. Každopádně je to jen a&nbsp;jen
      o&nbsp;označení směru, takže Joulovo teplo výjde určitě stejně.
