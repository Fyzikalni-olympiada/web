  text: 'Dobrý den, mám dotaz: nejsou úplně jasně definována kritéria úspěšného řešitele školního kola. Jde mi o&nbsp;to, zda experimentální úloha, pokud je úspěšně řešena, může být jednou z pěti uznaných úspěšně řešených úloh (u exp. úloh není ve vzorovém řešení uvedeno bodování), nebo je úspěšným řešitelem jen ten, kdo vyřeší úspěšně 5 početních úloh do 5 bodů  a&nbsp;navrch ještě řeší (s jakýmkoli výsledkem) tu experimentální. Výklad tohoto pravidla nebyl v&nbsp;posledních letech jednoznačný. Můj dotaz se týká všech kategorií od B do F.<br /><br />Předem děkuji za odpověď.<br /><br />Josef Křeček'
