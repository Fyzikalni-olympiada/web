  text: 'Dobrý den,<br />zajímá mě, jestli je správná a&nbsp;pro řešení akceptovatelná úvaha k&nbsp;úloze 4b) kat. B&nbsp;&ndash; obvod s&nbsp;diodou: Jedná se o&nbsp;elektromagnetický harmonický oscilátor, kde díky přítomnosti diody proběhne pouze půlperioda kmitu. Během čtvrtperiody do dosažení maximálního proudu projde obvodem náboj Q a&nbsp;na kondenzátoru se sníží napětí o&nbsp;7V (řešení a)). Během další čtvrtperiody projde tedy ale obvodem logicky tentýž náboj, a&nbsp;tudíž dojde i&nbsp;ke stejnému úbytku napětí, které je přímo úměrné přenesenému náboji (U= 1/C * Q), tj. dalších 7V. Výsledek sedí, jen jestli to není náhoda...  Děkuji za odpověď'
