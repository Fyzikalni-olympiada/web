  title: Postup do regionálního kola
  posted: '2005-03-31 17:42:54'
  who: student
  text: "Hmmm, kategorie F(tercie 8. třídy) končí u&nbsp;kola okresního :-(, zatímco E (kvarta 9. třídy) pokračují dál a&nbsp;dál..\r<br />je to velká škoda, zajímal by mě důvod :-) ten rok snad roli nehraje.."
  children:
  - id: 79
    author: Ivo Volf
    email: ivo.volf@uhk.cz
    title: 'Re: Postup do regionálního kola'
    posted: '2005-04-07 11:21:33'
    who: student
    text: "Soutěž probíhá podle organizačního řádu, který je závazný pro všechny organizátory. Tam se u&nbsp;kategorií EFG uvažuje, že kategorie G (Archimédiáda) má domácí kolo a&nbsp;kolo školní (původně to mělo být zábavné odpoledne), kategorie F má domácí a&nbsp;okresní kolo a&nbsp;kategorie E má kolo domácí, okresní a&nbsp;krajské. Tam nás již zajímají ti nejlepší, kteří se po prázdninách hlásí do kategorie D a&nbsp;postupně mohou absolvovat další kategorie a&nbsp;mohou se z nich vybírat účastníci do mezinárodní fyzikální olympiády. Jde tedy jen o&nbsp;organizační řád, nejde o&nbsp;věk. Soutěžící se však může účastnit fyzikální olympiády ve \"své\" kategorii nebo se souhlasem učitele v&nbsp;kategorii vyšší&nbsp;&ndash; nic nebrání tomu, aby osmák řešil úlohy určené pro deváťáky, ale... musí potom sám studovat. Snažíme se větčinou, aby fyzikální úlohy odpovídaly učivu, které se probírá ve škola, a&nbsp;co se nepovede, musí si student dohonit sám. Stačí?\r<br />Odpovídal Prof. RNDr.Ivo\
      \ Volf, CSc., předseda ÚVFO"
    children:
    - id: 81
      author: tajo
      email: tajo@atlas.cz
      title: 'Re: Re: Postup do regionálního kola'
      posted: '2005-04-07 17:12:58'
      who: student
      text: "Ano, možnost účastnit se vyšších kategorií je dobrá, ale studium by zabralo hodně času, třeba dnes, po úspéšném kole F lituji, že jsem nezkusil raději E, 3/4 úloh byli stejné...\r<br />Kolo F alespon poslouží jako taková ukázka..\r<br />"
- id: 78
  author: učitel fyziky L.Hejný
  email: ladislav.hejny@zsom.prelouc.in
  title: Dotaz
  posted: '2005-04-06 09:31:05'
  who: ucitel
  text: "Chtěl bych se zeptat, kdy budou učitelům fyziky k&nbsp;dispozici výsledky řešení příkladů určených pro kategorii G&nbsp;&ndash; Archimediáda 2005?Jde o&nbsp;přesné,stejné a&nbsp;věrohodné vyhodnocení prací u&nbsp;všech zúčastněných žáků.\r\n<br />"
  children:
  - id: 80
    author: Ivo Volf
    email: ivo.volf@uhk.cz
    title: 'Re: Dotaz'
    posted: '2005-04-07 11:26:47'
    who: ucitel
    text: "V nejnižších kategoriích zveřejňujeme řešení úloh ve dvojím tvaru: na webu se krátkou dobou před uzavřením školního kola objeví stručné výsledky, doplněné o&nbsp;principy bodování protokolů o&nbsp;řešení. Úplné řešení najdete v&nbsp;metodickém časopise Školská fyzika. \r<br />Na web dáváme výsledky proto, že si mohou svá řešení zkotrolovat i&nbsp;soutěžící, neboť samotný výsledek je jako řešení nepostačující&nbsp;&ndash; musí být doplněn postupem řešení. Navíc úlohy tam zadávané jsou většinou jednoduché a&nbsp;učitel nemá (na rozdíl např. od kategorie A) pochybnosti o&nbsp;způsobu řešení, avšak potřebuje si výsledek zkontrolovat a&nbsp;ubezpečit se, že jeho postup je&nbsp;&ndash; s&nbsp;ohledem na záměry autora úlohy&nbsp;&ndash; v&nbsp;pořádku."
