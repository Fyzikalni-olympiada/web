  author: 'Mgr. Zbyněk Auer, emeritní člen '
  email: zbynek.auer@seznam.cz
  title: Archimediáda 2016
  posted: '2016-05-13 21:17:44'
  who: ucitel
  text: Oficiální výsledky zatím nejsou. Zadání prvního příkladu bylo problematické. Asi by to byla dlouhá diskuze, pominu-li to, že zrychlený pohyb se v&nbsp;7. třídě neučí a&nbsp;navíc nebylo uvedeno o&nbsp;jaký zrychlený pohyb se jednalo. Nabízela se různá náhradní řešení, otázka pak je, zdali je to fyzika nebo rébus. Také d) ve 2. úloze, které vyžaduje třetí odmocninu z 10 asi u&nbsp;sedmáků nezíská mnoho příznivců. Jde to nějak jinak ?
  children:
  - id: 1493
    author: Lukáš Richterek
    email: lrichterek@gmail.com
    title: 'Re: Archimediáda 2016'
    posted: '2016-05-23 19:08:41'
    who: ucitel
    text: 'Dobrý den, i&nbsp;když s&nbsp;malým zpožděním, řešení školního kola Archimédiády bylo zveřejněno počátkem minulého týdne (<a href="http://fyzikalniolympiada.cz/archimediada?who=ucitel)." title="http://fyzikalniolympiada.cz/archimediada?who=ucitel).">fyzikalniolympiada.cz/archimediada?who=ucitel).</a> <br />Co se týče námitkám ke znění úloh, máte jistě pravdu, že se v&nbsp;základní výuce žáci nemusejí s&nbsp;některými pojmy setkat. Nicméně smysl olympiády není jen soutěž samotná, ale v&nbsp;ideálním případě se v&nbsp;ní žáci naučí něco nového. Při rozvolněnosti školních vzdělávacích programů lze jen těžko nalézt dostatečně široký průnik témat, která absolvují všichni. Proto i&nbsp;když se snažíme vycházet ze sledu učiva v&nbsp;nejpoužívanějších učebnicích (Bohuněk+Kolářová, Macháček), nelze něco málo navíc snad považovat za velký prohřešek. Myslím, že i&nbsp;ve srovnání s&nbsp;dalšími předmětovými olympiádami patří právě FO k&nbsp;těm konzervativnějším, které  vycházejí z "obvyklého"
      obsahu učiva.    '
