  author: Josef Jírů
  email: josef.jiru@email.cz
  title: úloha 66A-2-3 Jaderná elektrárna
  posted: '2025-09-24 16:18:35'
  who: ucitel
  text: Jako učitel v&nbsp;uváděném řešení úlohy 66A-2-3 Jaderná elektrárna vidím následující rozpor:<br />Pokud by se podle d) při plném výkonu spotřebovalo za 1 den 35,8 kg oxidu uraničitého s&nbsp;izotopem 235U, pak do výměny paliva podle e) se za dobu 2,53 r = 923 d spotřebuje 33 t z celkové hmotnosti 42 t palivových článků v&nbsp;reaktoru, přitom tato složka s&nbsp;235U tvoří méně než 5 % paliva.<br />Dle mého výpočtu se za 1 sekundu rozštěpí 1475e6/(201e6*1,602e-19) = 4,58e19 jader, tedy hmotnost oxidu uraničitého, který obsahuje izotop 235U, pak za 1 den je 86400*4,58e19*(235+2*16)*1,66e-27 kg = 1,75 kg (nikoliv 35,8 kg).<br />
