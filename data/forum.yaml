- id: 1911
  author: Martin Hrubec
  email: martin.hrubec@volny.cz
  title: Nespokojenost s vaší prezentací
  posted: '2022-04-20 07:52:19'
  who: ucitel
  text: Dobrý den, nejsem student ani učitel, ale pouze rodič jednoho z úspěšných řešitelů a&nbsp;výherce okresního kola v&nbsp;kategorii E (Příbram). Někde ve vašich stanovách jsem se dočetl, že vaším cílem je propagovat fyziku, ale z vašich stránek to rozhodně vidět není. Já bych očekával, že zde minimálně uvidím seznam postupujících do krajského kola a&nbsp;poté i&nbsp;jejich výsledky, místo toho zde narazím na totálně nefunkční stránky Středočeského kraje. U&nbsp;ostatních krajů to není o&nbsp;mnoho lepší (čest Praze, Liberci, a&nbsp;možná ještě některým dalším&nbsp;&ndash; úplně vše jsem neprocházel, ale stačilo mi to)&nbsp;&ndash; je vidět, že zveřejnění seznamu (výmluvy na GDPR a&nbsp;tak...) nic nebrání, jen se musí chtít. Nevím, jestli syn opravdu nepostoupil (27 bodů by v&nbsp;Praze i&nbsp;Liberci stačilo) nebo za to může jen chaos ve vaši organizaci&nbsp;&ndash; zveřejněný seznam by úplně postačil. <br />S tím souvisí i&nbsp;mizerná účast v&nbsp;okresních kolech (v průměru žáci
    tak ze tří čtyř škol)&nbsp;&ndash; mizerná propagace v&nbsp;ústředí&nbsp;&ndash; v&nbsp;přímé úměře je mizerná propagace na školách. Neberu výmluvy, že to na obyčejných školách nejde, zrovna v&nbsp;Příbrami se zúčastňuje této olympiády škola ZŠ Březové Hory, Příbram (nejsem s&nbsp;ní nijak spojen)&nbsp;&ndash; podle mne normální nevýběrová škola a&nbsp;dosahuje velmi slušných výsledků (pravděpodobně díky učitelům a&nbsp;učitelkám fyziky co do toho vrazí trochu svého času). Žáci, co o&nbsp;této soutěží neví, se jí samozřejmě nezúčastní :-(. A&nbsp;šance, že je fyzika zaujme, je zase o&nbsp;něco menší.<br />Třeba vás to inspiruje ke zlepšení anebo jste spokojeni s&nbsp;tím jak to funguje&nbsp;&ndash; já vám vaše kruhy brát nebudu. Podle mne to tedy rozhodně nefunguje.<br />S pozdravem<br /><br />                      Martin Hrubec
  children:
  - id: 1912
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
