    text: Dobrý den, k&nbsp;Vašim dvěma dotazům:<br /><br />1) Vámi uvedené tři březnové termíny se týkají kat. E a&nbsp;F. Na organizaci Archimediády ve vašem okrese je třeba se informovat na ddm Třebíč, resp. u&nbsp;předsedy Vaší okresní komise FO&nbsp;&ndash; jsem přesvědčen, že termíny uvedené zde na webu pro Archimediádu platí (tj. konec školního kola 6. května 2016).<br /><br />2) Spojení na předsedu krajské komise Kraje Vysočina je karelryska@gymnaziumjihlava.cz.<br /><br />J. Jírů, člen UK FO
