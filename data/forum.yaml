- id: 1529
  author: Martin S.
  title: Domácí kolo, kategorie B
  posted: '2017-04-08 09:47:35'
  who: student
  text: Dobrý den, rád bych se zeptal na jednu úlohu z letošního domácího kola kategorie B, a&nbsp;sice na úlohu č. 2 (Dva válečky na kladce). Není mi jasné, proč v&nbsp;úkolu b) se neuvažují tahové síly T ve vláknu, resp. proč se nesestaví dvě pohybové rovnice pro levý a&nbsp;pravý váleček. Např. pro první fázi pohybu je pro levý váleček +T a&nbsp;pro pravý –T, po sečtení rovnic vychází stejný výsledek jako v&nbsp;autorském řešení, ale násobený výrazem (m_1)/(m_1+m_2). V&nbsp;úkolu c) mi zase není jasné, proč se jako hmotnost uvažují oba válečky, když se uvažuje pouze síla působící na levý váleček. Děkuji mockrát za jakoukoli odpověď či objasnění, kde se mýlím.
  children:
  - id: 1562
    author: Jakub
    title: 'Re: Domácí kolo, kategorie B'
    posted: '2018-01-16 11:14:27'
    who: student
    text: Dobrý den,<br />vzhledem k&nbsp;tomu, že se mě stalo totéž, co Vám- tj. při poukázání na chybné autorské řešení jsem nedostal žádnou odpověď ani odůvodnění- pokusím se připojit svůj názor. <br /><br />ad b) určitě máte pravdu. Autor neuvažoval tahovou sílu vlákna, proto stvořil chybnou pohybovou rovnici. Kdyby to totiž bylo, jak tvrdí on, musela by se závaží pohybovat s&nbsp;různým zrychlením, což je vyloučeno. V&nbsp;zadání je ještě zmínka o&nbsp;jakémsi "otáčení systému"- je zřejmé jak je to myšleno, protože samovolně by děj popsaný v&nbsp;zadání neprobíhal (celková energie systému by na konci byla vyšší). Potom ovšem musí na celý systém působit nějaká vnější síla, o&nbsp;níž nevíme vůbec nic!<br /><br />ad c) problém je v&nbsp;tom, že ona síla, která vrací LEVÉ ZÁVAŽÍ do rovnovážné polohy musí být opět vynásobena m1/(m1+m2). Čili nakonec má výsledek autor správně (zde patrně pouze nesprávně použil sílu Fx pro sílu, která vrací do rovnovážné polohy celý systém.)
- id: 1530
  author: Martin S.
  title: Studijní text, kategorie B
  posted: '2017-04-08 22:46:49'
  who: student
  text: Dobrý den, chtěl bych se zeptat na úlohu 15 (str. 39) z letošního studijního textu pro kategorii B (Obvody střídavého proudu s&nbsp;lineárnímy jednobrany a&nbsp;dvojbrany). Tato úloha navazuje na příklad 12. Pokud to chápu správně, tak jde o&nbsp;to dosadit za L = 2*L_1 a&nbsp;C = (C_1)/2 do vztahů z př. 12. Mezi indučností, kapacitou a&nbsp;odporem je poté vztah (L_1)/(C_1) = (R^2)/2. Problém je teď v&nbsp;tom, že mi stále vychází identický vztah pro napěťový přenos, a&nbsp;tedy i&nbsp;jeho velikost a&nbsp;další. Dosazuji za L i&nbsp;do výrazu j*ω*L/R a&nbsp;vychází j*f/(f_d)*odmocnina(2), i&nbsp;když má vycházet podle výsledků  j*f/(f_d)*1/(odmocnina(2)). Prosím Vás o&nbsp;radu, kde dělám chybu. Děkuji za pomoc.
