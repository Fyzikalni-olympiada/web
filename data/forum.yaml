- id: 1270
  author: Michal Matoulek
  email: michalmatoulek01@gmail.com
  title: Archimédiáda - úloha 4
  posted: '2013-05-05 16:23:02'
  who: student
  text: Dobrý den, u&nbsp;této úlohy není jasné, jestli jsou cihly v&nbsp;pozemku a&nbsp;nebo jestli hranice pozemku prochází středem cihel.<br />   Bez této informace jsou dvě možnosti:<br />1. Obvod pozemku vydělený délkou hrany se rovná počtu cihel.<br />2. Obvod pozemku minus 4x0,29 m (rohové cihly, které by po vydělení obvodu délkou hrany cihly přidaly 4 cihly navíc)<br /><br />Podle stavebního zákona musí být všechny cihly v&nbsp;pozemku a&nbsp;ani polovina cihly nesmí přesahovat. Správně by tedy měla být možnost druhá.<br /><br />Děkuji Michal Matoulek
  children:
