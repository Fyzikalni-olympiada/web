- id: 1790
  author: student
  title: Dotaz ohledně příkladu
  posted: '2021-02-03 15:34:00'
  who: student
  text: Dobrý den, snažil jsem se spočítat jeden příklad z minulých ročníků (57. ročník, kategorie C školního kola, 3. příklad, část b)). K&nbsp;přiblížení ke dnu je v&nbsp;řešení uveden tento vzorec:<br /><br />∆s = π(D^2 − d^2):(πD^2)∆h<br /><br />Bohužel nemám tušení, jak se k&nbsp;tomuto vzorci dostat. Já jsem uvažoval tak, že když kádinku ponoříme o&nbsp;<br />∆s, tak vytlačí objem ∆s*0.5πd^2 = ∆h*0.5π(D^2 − d^2), takže by nakonec mělo platit:<br />∆s = π(D^2 − d^2):(πd^2)∆h. Vyšel mi prakticky stejný vzorec, ale ve jmenovateli mám průměr kádinky místo průměru válce. Mohli byste mi prosím říct, kde jsem udělal chybu a&nbsp;jak se dostat ke správnému vzorci? Děkuji moc<br /><br />
  children:
  - id: 1791
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: Dotaz ohledně příkladu
    posted: '2021-02-03 20:28:20'
    who: student
    text: Nejprve upřesnění, nejde o&nbsp;školní kolo, nýbrž o&nbsp;kolo krajské.<br />Základní výraz 4*deltam/(pí*ró*d^2) udává přiblížení ke dnu za 1 sekundu, pokud se nemění výška okolní hladiny. Poměr (D^2-d^2)/D^2 lze chápat jako korekční činitel s&nbsp;proměnnou D jakožto průměrem vnější nádoby. Pokud pokus provedeme na rybníku, pak D je mnohem větší než d a&nbsp;korekční činitel se blíží k&nbsp;hodnotě 1 v&nbsp;souladu s&nbsp;naší představou. Pokud by ve jmenovateli bylo d^2 místo D^2, tak se korekční člen blíží k&nbsp;nekonečnu.<br />Tato úvaha vede pouze k&nbsp;rozhodnutí, která za dvou alternativ je správná. Vlastní odvození je třeba provést pomocí obrázku.
