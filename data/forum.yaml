  posted: '2016-03-12 14:45:47'
  who: ucitel
  text: 'Hezký den, mám prosím několik dotazů...<br />Jsme škola z Náměště nad Oslavou (kraj Vysočina) jen pro upřesnění<br /><br />1) Na stránkách máte uvedeno, že školní kolo končí 6.5.2016<br />    Mně ovšem došel mail od Lenky Sochorové (ddm Třebíč), že domácí kolo končí 9.3.2016.<br />     Dále v&nbsp;mailu od ní bylo uvedeno: "Opravené úlohy s&nbsp;přehledem řešitelů je třeba doručit nejpozději do<br />     14.3.2015 Mgr. Ludmile Prokešové  nebo  Mgr. Stanislavu Prokešovi na Gymnázium Třebíč.<br />     Termín okresního kola je středa 23.3.2015"<br /><br />    Co si tedy mám vybrat a&nbsp;komu věřit?<br />    Termín 9.3. určitě nestihneme, mám tedy FO považovat za odpískanou?<br /><br /><br />2)  Jak mohu komunikovat s&nbsp;předsedou krajské komise pro Vysočinu (Mgr. Ryška),<br />     když není u&nbsp;jeho jména uveden mail?<br /><br /><br />Otázek bych měl daleko více, ale pro začátek mi stačí alespoň toto vědět...<br />Děkuji za odpověď<br />'
