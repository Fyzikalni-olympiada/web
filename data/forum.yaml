  posted: '2023-02-18 11:56:35'
  who: student
  text: Dobrý den,<br />mám dotaz k&nbsp;loňskému řešení 1.úlohy z celostátního kola. Jak může být úhel, pod kterým se sbíhají paprsky stejný jako úhel, pod kterým vidíme slunce? Při řešení mě napadlo jestli to tak není, ale po chvilce přemýšlení jsem si řekl, že to tak být nemůže.<br />Děkuji.
  children:
  - id: 1965
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Úloha'
    posted: '2023-02-18 19:01:08'
    who: student
    text: Ano, máte pravdu, jsou to dva různé úhly&nbsp;&ndash; úhlová velikost Slunce při pohledu ze Země je poněkud větší než úhel mezi paprsky ohraničujícími plný stín Země. Vzhledem k&nbsp;tomu, že průměr Země je 109krát menší než průměr Slunce, tak ztotožněním těchto úhlů se dopouštíme chyby menší než 1 procento. Obrázek 1 v&nbsp;zadání je pouze ilustrační, není v&nbsp;něm dodrženo měřítko pro rozměry a&nbsp;vzdálenosti. Také v&nbsp;předpokladu úlohy je uvedeno, že vzdálenost Země Měsíc je mnohem menší než vzdálenost Země Slunce.
