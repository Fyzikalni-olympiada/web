  who: student
  text: 'Dobrý den. Řeším kategorii D. Chtěl jsem se zeptat, kolik minimálně bodů v&nbsp;domácím kole musím nahrát, abych se dostal do krajského kola. Na vašich internetových stránkách se udává: "Úspěšní řešitelé prvního kola jsou ti z vás, kteří úspěšně vyřeší alespoň pět úloh." Úspěšným vyřešením se tedy myslí za 5 úloh 50b? Děkuji za odpověď.'
