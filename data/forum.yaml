- id: 1696
  author: Josef Křeček
  email: josef.krecek@gymnp.cz
  title: Jaký je smysl změn v organizaci kategorií E,F?
  posted: '2020-01-22 09:51:41'
  who: ucitel
  text: Dobrý den,<br />velmi by mě zajímalo, proč byl termín okresních kol kategorií E,F posunut z tradičního března na leden. Tedy na období, kdy jsou fyzikáři i&nbsp;žáci zaneprázdněni uzavíráním známek za 1. pololetí (mnozí z fyzikářů jsou i&nbsp;třídní, takže jim k&nbsp;tomu přibývá třídnická agenda, někteří mohou být se svými třídami i&nbsp;na lyžařských výcvicích atd.), na období, které je i&nbsp;obdobím chřipkových epidemií apod. Z těchto důvodů se mi tato změna jeví jako naprosto nevhodná. Už tak je účast v&nbsp;FO ve srovnání s&nbsp;jinými předmětovými soutěžemi malá, vzhledem k&nbsp;její 60 let rigidní a&nbsp;pro žáky již dávno neatraktivní formě (ale o&nbsp;tom jsem tu psal už před pár lety a&nbsp; další debaty na toto téma mi přijdou jako házení hrachu na zeď) a&nbsp;tyto termínové změny ji podle mého názoru dále sníží. Navrhuji návrat k&nbsp;původním termínům, tedy okresní kola v&nbsp;březnu a&nbsp;krajská v&nbsp;kategorii E v&nbsp;dubnu, resp. kompromis okres v&nbsp;únoru
    a&nbsp;kraj v&nbsp;březnu. Argumentům o&nbsp;přijímacím řízení zde v&nbsp;diskusi sice částečně rozumím, nicméně i&nbsp;tam by se ještě výsledky únorových nebo březnových okresních kol daly zohlednit a&nbsp;navíc mám zkušenost (alespoň v&nbsp;našem okrese), že většinu účastníků okresních kol tvoří žáci nikoli ZŠ, ale nižšího stupně víceletých gymnázií, které žádné přijímačky nečekají.<br />S úctou<br />RNDr. Josef Křeček, Gymnázium a&nbsp;SOŠPg Nová Paka
