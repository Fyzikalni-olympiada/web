    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: Dotaz'
    posted: '2015-03-13 07:34:23'
    who: student
    text: 'Dobrý den. Bodová hranice není stanovena, ale je třeba vyřešit alespoň pět úloh za pět bodů a&nbsp;odevzdat řešení experimentální úlohy. Příklad takého bodového hodnocení: 6-5-2-5-10-2-7. Takovéto hodnocení na postup nestačí: 10-10-10-4-4-10-4.'
