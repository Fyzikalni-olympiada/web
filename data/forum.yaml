  text: Výsledky uváděné ve vzorovém řešení lze snadno ověřit výpočtem – vychází z2 = 15 mm, z3 = 106 mm, zatímco ve vzorovém řešení se uvádí hodnoty 17 mm a&nbsp;97 mm. <br />Požadovanou konstrukcí při respektování paraxiálních paprsků se v&nbsp;obou případech moje odchylka od početního řešení vešla do 1 mm.  <br />Ve vzorovém řešení však vidím nepřesnou konstrukci a&nbsp;v&nbsp;rozporu se zadáním užití neparaxiálních paprsků u&nbsp;zrcadla.
