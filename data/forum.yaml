  children:
  - id: 216
    author: Jan Houštěk
    email: jan.houstek@mff.cuni.cz
    title: 'Re: Celostátní kola'
    posted: '2006-01-23 19:53:01'
    who: student
    text: Pouze v&nbsp;kategorii A, která má domácí, regiánální a&nbsp;celostátní kolo a&nbsp;z vítězů celostátního kola se poté sestavuje tým pro MFO. Kategorie B,C,D mají pouze domácí a&nbsp;regionálním kolo. Kategorie E má tři kola -- domácí, okresní a&nbsp;oblastní, kategorie F pouze domácí a&nbsp;okresní. Organizace Archimediády (kategorie G) je zcela odlišná. Všechny tyto informace snadno naleznete na tomto webu, začněte odkazem "Co je FO?".
