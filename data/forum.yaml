    text: 'Dobrý den, děkujeme za dotaz. Samozřejmě se nejedná o&nbsp;odraz a&nbsp;lom, na druhou stranu intuitivní představu o&nbsp;pojmu osvětlení máme z každodenní zkušenosti a&nbsp;pojem je stručně zaveden i&nbsp;v&nbsp;zadání úlohy. V&nbsp;tomto smyslu se nepředpokládají další vstupní znalosti a&nbsp;závislost na vzdálenosti mají řešitelé ověřit měřením, nikoli na základě jim známého teoretického modelu.Pokud to spojí s&nbsp;nějakým vztahem, který najdou, je to samozřejmě bonus navíc. <br />Orientační okruhy neznamenají nutně povinnost zadat takové úlohy ve školním kole, je to ale pochopitelně lepší pro přípravu na okresní resp. krajská kola (kde experimentální úlohy nejsou zařazeny). Pokud Vám pro Vaše žáky připadá vhodnější druhá experimentální úloha, můžete jim navrhnout k&nbsp;řešení tu druhou.  '
