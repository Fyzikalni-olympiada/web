  text: Dobrý den,<br />Mám dotaz ohledně 3. úlohy ,,Na trati Paris Nord&nbsp;&ndash; Bruxelles-Midi,,.Když zadám např. odjezd ve 12.00h,tak se mi tam ukážou 3 spoje a&nbsp;jeden z nich se nenazývá jako ten v&nbsp;nadpise,mám ho do ulohy počítat také nebo jen ty Paris Nord a&nbsp;Bruxelles-Midi ? A&nbsp;když je tam třeba 2x ten samý vlak se stejným odjezdem,tak je to bráno jako jeden,ne? A&nbsp;poslední otázka ... :) Záleží na tom,ve který den (pátek,pondělí,středa,...) zadám odjezdy a&nbsp;příjezdy ? ... Děkuji za odpoved.
