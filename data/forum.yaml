  posted: '2019-04-04 18:49:28'
  who: student
  text: 'Vážení organizátoři,<br /><br />Jistá věta ve třetí úloze mi nedává spát: "U jedné z družic, obíhajících po kruhové dráze, bylo<br />zjištěno, že se družice nacházela přesně nad rovníkem na 20◦ východní délky a&nbsp;na<br />160◦ východní délky."<br /><br />Nejedná se o&nbsp;chybu? Podle tohoto zadání "průsečíky" kruhové dráhy družice s&nbsp;rovníkem neleží proti sobě (jejich spojnice se středem Země nesvírají přímý úhel). Jejich spojnice pak neprochází středem Země a&nbsp;na otázku a) by se nedalo odpovědět, neboť kružnice kolem středu neobíhá. Kdyby však jeden z druhé dvojice udaných úhlů náležel západní délce, rovina dráhy by procházela středem a&nbsp;kružnice by kolem něj tedy mohla obíhat.<br /><br />Máme tedy s&nbsp;pracovat se západní délkou, nebo se o&nbsp;chybu nejedná a&nbsp;dráha skutečně rovník míjí dvakrát na jedné polokouli? '
  children:
  - id: 1628
    author: Eliška
    email: eli.korcova@gmail.com
    title: 'Re: Úloha 3 v domácím kole kategorie C'
    posted: '2019-04-05 19:36:37'
    who: student
    text: Nejsem sice organizátor, nicméně myslím, že v&nbsp;tomhle ohledu problém není&nbsp;&ndash; družice se může pohybovat jinou úhlovou rychlostí než Země, a&nbsp;tak se Země jakoby "podtočí" pod družicí&nbsp;&ndash; snad to chápeš. K&nbsp;tebou popisované situaci by došlo, kdyby se Země i&nbsp;družice pohybovaly stejnou úhlovou rychlostí. <br />Zaráží mě spíše jiná věc, která se také týká této úlohy a&nbsp;souvisí s&nbsp;již zmíněným "podtáčením" Země pod družicí. V&nbsp;zadání není napsáno, jestli družice přeletí nad rovníkem nad jednou z. š., dostane se nad jednu z polokoulí a&nbsp;hned, jak se dostane k&nbsp;druhé z. š., přeletí rovník nebo jestli je družice pomalejší, přeletí nad jednou z. š. a&nbsp;během toho, co se bude nacházet nad jednou z polokoulí, se Země pod ní stihne protočit jednou, dvakrát, třikrát atd., než družice opět přeletí nad rovníkem. Není ani specifikováno, jakým směrem se družice pohybuje (podle, nebo proti směru hodinových ručiček?). Doufám, že je to, co jsem
      napsala, aspoň trochu srozumitelné. Možná to jsou blbosti, ale opravdu nevím, jak úlohu chápat. Snad se najde někdo s&nbsp;vysvětlením, předem děkuji.
