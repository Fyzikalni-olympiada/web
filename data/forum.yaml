- id: 1868
  author: zmatený student
  title: 7A
  posted: '2021-11-20 14:12:10'
  who: student
  text: <br />Dobrý den, snad už naposled :).<br /><br />Zadání 7A je dost parametrické, protože může nastat spoustu situací (niť s&nbsp;nábojem q bude směřovat dolů nebo nahoru, toto záleží na jaké straně svírá niť s&nbsp;tyčí úhel beta), taky l1 hraje svojí roli pokavaď Q1 a&nbsp;Q2 mají tíhu. Délka niťě s&nbsp;příslušným úhlem beta má tu roli, že síly, které působí na náboj q se buďto sčítají nebo odečítají.(tedy, jestli niť je výše, jak příslušný náboj.) S&nbsp;těmito kombinacemi vyjde strašně moc řešení. Mám tedy vycházet z obr 5. kde je situace aspoň trochu názornější nebo doopravdy úloha chce takto parametrizovat nebo jsem nějak zadání nepochopil?<br /><br /> Může tyč konat posuvný pohyb  s&nbsp;nití v&nbsp;rovnovážné poloze (náboj q) vzhledem k&nbsp;zemi?<br /><br />Děkuji
  children:
  - id: 1869
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: 7A'
    posted: '2021-11-20 18:14:43'
    who: student
    text: Tak dobře, tyč je spojena se zemským povrchem tak, že kulička na niti má volný operační prostor, jaký jí dovolí délka nitě uvázané mezi náboji Q1 a&nbsp;Q2 na tyči. Pak otázka "tíhy nábojů" je bezpředmětná.<br />Nerozumím formulaci o&nbsp;"sčítání či odčítání sil". V&nbsp;každém bodě definovaného operačního prostoru na kuličku působí náboje Q1 a&nbsp;Q2 elektrickými silami, jejichž výslednice je určena jejich vektorovým součtem.<br />Úhel měříme s&nbsp;orientací podle obrázku od 0 do 180 stupňů.
