  author: řešitel
  title: Otázka k příkladu
  posted: '2019-12-29 12:16:39'
  who: student
  text: Dobrý den, musí v&nbsp;5 příkladu kategorie D vycházet N (počet vagónů) jako celé číslo?
  children:
  - id: 1680
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Otázka k příkladu'
    posted: '2019-12-30 01:17:18'
    who: student
    text: Každý údaj v&nbsp;zadání musel být změřen, případně vypočten z jiných naměřených údajů, tudíž uvedená hodnota je zadána s&nbsp;jistou nenapsanou tolerancí, která je však dána počtem platných číslic. Např. uvedná hmotnost vagónu 45 tun neznamená 45,00000... tun, neboli přesně 45 tun. Má-li vagón např. o&nbsp;300 kg více, tak s&nbsp;přesností na dvě platné číslice, jak je uvedena hmotnost v&nbsp;zadání, má stále 45 t. (Pokud by byla uvedená hmotnost 45,0 t, tj. na 3 platné číslice, pak již nemůže mít o&nbsp;300 kg více.) Z toho plyne, že pokud z uvedených údajů počítáme počet vagónů, pak je třeba výsledek zaokrouhlit na celé číslo.
