  email: polak@gymnachod.cz
  title: Samostříl
  posted: '2022-01-20 12:51:28'
  who: ucitel
  text: Prosím o&nbsp;upřesnění textu úlohy kat. A, krajské kolo<br />Samostříl je umístěný na vozíku jedoucím vodorovně rychlostí o&nbsp;velikosti v0<br />2 . Dojaké největší vzdálenosti měřené na zemi může šíp vystřelený do prostoru za<br />vozík doletět? Jaké největší výšky přitom dosáhne?<br />Co znamená výraz:<br />šíp vystřelený do prostoru za vozík<br />Patří sem situace, kdy šíp byl vystřelen téměř svisle vzhůru (nepatrně odchýlen od kolmice proti směru pohybu vozíku?)<br />Z hlediska vozíku bude mít nepatrnou, ale nenulovou složku rychlosti dozadu.
  children:
  - id: 1885
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Samostříl'
    posted: '2022-01-20 20:39:22'
    who: ucitel
    text: Tak to je velmi diplomaticky naznačená perfektní vychytávka! V&nbsp;publikovaném řešení je uvedeno maximum vzdálenosti místa dopadu za vozíkem. Ještě větší maximum však bude v&nbsp;opačném směru&nbsp;&ndash; limitně pro elevační úhel 90°. Uvedená funkce sin(2alfa)-sin(alfa) tam sice nemá nulovou derivaci, ale v&nbsp;uvažovaném intervalu 0 až 90° má v&nbsp;absolutní hodnotě své maximum právě v&nbsp;krajním úhlu 90°. Tato možnost jako recenzentovi mi unikla, za což se omlouvám.
- id: 1884
  author: Polák Zdeněk
  email: polak@gymnachod.cz
  title: Kondenzátor
  posted: '2022-01-20 13:17:08'
  who: ucitel
  text: 4. úloha<br />Ideální deskový kondenzátor má elektrody o&nbsp;ploše S, které jsou ve vzdálenosti d.<br />Desky jsou nabité a&nbsp;intenzita elektrického pole mezi deskami je E.<br /><br />Proč v&nbsp;části c, předpokládáme, že náboj na deskách se nemění? To není v&nbsp;zadání úlohy.Naopak v&nbsp;zadání je řečeno, že v&nbsp;prostoru mezi deskami je intenzita E a&nbsp;není nic řečeno o&nbsp;tom, že by se měla měnit. Když zadání úlohy zaručuje, že intenzita pole mezi deskami je E, tak holt musíme kondenzátor dobíjet, aby se intenzita nezměnila. Proto autorské řešení pokládám za chybné.
  children:
  - id: 1886
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Kondenzátor'
    posted: '2022-01-21 12:36:43'
    who: ucitel
    text: Podle mne zadání nezaručuje konstantní intenzitu při změně podmínky v&nbsp;části c). Je na řešiteli, aby posoudil, které veličiny se popsanou změnou (přítomností dielektrika mezi deskami) změní a&nbsp;které zůstanou konstantní.
    children:
    - id: 1887
      author: Zdeněk Polák
      email: polak@gymnachod.cz
      title: 'Re: Kondenzátor'
      posted: '2022-01-21 13:27:00'
      who: ucitel
      text: A pak vyvstává otázka, co zaručuje stálou plochu S&nbsp;a&nbsp;stálou vzdálenost d?<br />Jestliže jsou dány některé údaje v&nbsp;zadání úlohy, pak je nutné jednoznačně určit, které jsou stálé i&nbsp;pro další situace. Jinak úloha pozbývá smyslu. Jestliže není zmíněno, že desky jsou nabity nábojem Q, který je neměnný, ale naopak implicitně lze předpokládat, není-li zmíněna velikost náboje, že může mít jakoukoli, dále proměnnou hodnotu, nezbývá, než se držet zadaných veličin S,d, E. To je dáno a&nbsp;s&nbsp;tím s&nbsp;nedá nic dělat. Je to v&nbsp;zadání. <br />Tato úloha je podle mnenejen chybně zadaná, ale i&nbsp;velmi zmateně autorsky řešená.<br />Já to  přiznám se nepochopil, ale porovnáím-li tuto úlohu se zadáním úlohy řešené ve fykosu<br /><br /><a href="https://fykos.cz/_media/rocnik14/ulohy/pdf/uloha14_1_2.pdf?cache=" title="https://fykos.cz/_media/rocnik14/ulohy/pdf/uloha14_1_2.pdf?cache=">fykos.cz/_media/rocnik14/ulohy/pdf/uloha14_1_2.pdf?cache=</a><br /><br />pak nabývám
        přesvědčení, že naopak tlak v&nbsp;kapalině mezi deskami klesá, neboť při nabitém kondenzátoru vystoupí kapalina výše než v&nbsp;nenabitém. Ale neměl jsem ani čas ani myšlenkový potenciál to řádně prostudovat. Zatím se jen těžko vyrovnávám s&nbsp;negativními pocity, jak autoři úloh fyzikální olympiády se nesmyslně náročnými, chybně zadanými, nepromyšlenými  a&nbsp;nedomyšlenými úlohami se snaží odradit co nejvíce studentů od jejich řešení. Zatím se vám to soudruzi docela úspěšně daří. <br /><br />Zveřejněte statistiku počtu úspěšných řešitelů za posledních 20 let a&nbsp;pak se můžeme bavit dál, co má smysl a&nbsp;co ne.<br /><br />
      children:
      - id: 1888
        author: Josef Jírů
        email: josef.jiru@email.cz
        title: 'Re: Kondenzátor'
        posted: '2022-01-21 18:38:13'
        who: ucitel
        text: 'Parametry S&nbsp;a&nbsp;d jsou pro kondenzátor přirozené konstanty, nikde se neuvádí možnost měnit vzdálenost mezi deskami či je vůči sobě posunovat. Další hodnota E je pro kondenzátor nastavitelná proměnná, v&nbsp;úloze je zadaná konkrétně. V&nbsp;otázkách a), b) se odvozuje energie, její hustota a&nbsp;síla mezi deskami pro toto nastavení intenzity. V&nbsp;části c) nastane změna tím, že mezi desky nateče voda jako dielektrikum. Tím se nezmění ani obsah S, ani vzdálenost d mezi deskami, ale na počátku nastavená intenzita z důvodu polarizace dielektrika klesne. Přitom náboj na deskách se změnit nemůže, není důvod&nbsp;&ndash; nemá odkud přitéct, kam odtéct, je to ideální kondenzátor tvořený dvěma elektrodami. To je popis standartního děje.<br />V úloze ve fykosu je rozdíl v&nbsp;tom, že desky jsou při svislé orientaci částečně ponořené. Obecně platí, že vlivem indukovaných nábojů na povrchu dielektrika je dielektrikum vtahováno mezi desky, ať pevné, či kapalné jako v&nbsp;případě
          našich úloh. Kapalina v&nbsp;souladu s&nbsp;Pascalovým zákonem vytváří na desky přídavný tlak. Výsledky obou úloh, ve fykosu i&nbsp;v&nbsp;FO, jsou přesně v&nbsp;souladu. Ve fykosu v&nbsp;úrovni okolní hladiny působí zvednutá hladina mezi deskami hydrostatickým tlakem delta p = delta h * ró * g = E^2 * epsilon 0 * (epsilon er&nbsp;&ndash; 1) / 2 , kde podle zadání je E = U/d v&nbsp;konečném stavu. V&nbsp;úloze FO je pro tlak ve jmenovateli navíc epsilon er, což koresponduje s&nbsp;tím, že v&nbsp;čitateli je původní intenzita E bez dielektrika.<br />Na invektivy reagovat nebudu a&nbsp;vše považuji za uzavřené.<br /> '
- id: 1889
  author: Benedikt
  email: bares.benedikt18a@student.gympldka.cz
  title: Poznámky k autorskému řešení
  posted: '2022-01-29 08:31:10'
  who: student
  text: 1B) Kdyby se vztlaková síla změnila, deska nebude v&nbsp;klidu, protože součet sil působících na ni by nebyl nulový.<br />2C) Zadání není jednoznačné&nbsp;&ndash; co je to "prostor za vozíkem"? Jednak to lze pochopit, že je potřeba aby šíp dopadl na opačnou stranu od místa výstřelu než je směr pohybu vozíku (tzn. vystřelit pod úhlem menším než 60°)&nbsp;&ndash; pak je autorské řešení v&nbsp;pořádku.<br />Ovšem já bych zadaní interpretoval spíše tak, že musím vystřelit pod úhlem menším než 90° směrem za vozík. Řešení by pak bylo shodné až po výpočet derivace a&nbsp;zjištění jednoho lokálního extrému (úhel, který se v&nbsp;autorském řešení prezentuje jako globální maximum), ovšem globální extrémy fce se mohou objevit též v&nbsp;krajních bodech definičního oboru fce, jak je tomu i&nbsp;zde&nbsp;&ndash; při vystřelení pod 90° (tedy kolmo). Zde sice vyjde minimum fce&nbsp;&ndash; ale vzdálenost se měří v&nbsp;absolutní hodnotě, a&nbsp;zde vyjde "záporná" vzdálenost větší než "kladná"
    vzdálenost z autorského řešení. A&nbsp;nakonec matematická poznámka&nbsp;&ndash; jelikož vystřelení kolmo vzhůru lze jen těžko považovat za vystřelení "do prostoru za vozík," musíme střílet pod úhlem ostře menším než 90° a&nbsp;v&nbsp;takovém případě (striktně matematicky vzato) extrém neexistuje, jelikož množina možných vzdáleností místa dopadu je (z maximální strany) otevřený interval, který extrém nemá.
