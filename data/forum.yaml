  posted: '2016-04-25 14:04:29'
  who: ucitel
  text: Při počítání úloh ze starších krajských kol studenti odhalili, že ve 2. příkladu je řešení ve části e) špatně. Odporová síla je totiž závislá na druhé mocnině rychlosti, takže po změně rychlosti z 30 m/s na 35 m/s je její hodnota 0,5 * 35*35 = 612,5 N, nikoliv 525 N. Tím jsou špatně i&nbsp;ostatní výsledky v&nbsp;této části.
