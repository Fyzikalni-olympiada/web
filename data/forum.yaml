      title: 'Re: Řešení domácího kola kategorie E, F'
      posted: '2015-03-18 17:15:08'
      who: ucitel
      text: 'Proč je tedy na stránce kategorie E,F napsáno ve sloupci Řešení: "Zveřejníme po termínu odevzdání".<br />Pokud si pamatuji předchozí ročníky, vždy jsem si stahoval řešení z webu a&nbsp;nikdy to nešlo přes koordinátory.<br /><br />Bylo by možná fajn "přes koordinátory" doručit řešení s&nbsp;předstihem třeba i&nbsp;několika měsíců, abychom svá řešení zkonfrontovali s&nbsp;řešením autorským. Když to takto funguje v&nbsp;matematické olympiádě, nevidím důvod, aby to nefungovalo v&nbsp;olympiádě fyzikální.<br /><br />Děkuji, pokud se někdo nad námětem zamyslí.<br /><br />PS: Nerad bych rozpoutal diskuzi o&nbsp;tom, jak výsledky proniknou mezi žáky apod. Pokud chce někdo bojovat nečestně, tak se v&nbsp;domácím kole zeptá strýčka fyzikáře a&nbsp;je to. Chléb se stejně láme až v&nbsp;kole okresním.'
