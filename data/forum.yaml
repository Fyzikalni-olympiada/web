  posted: '2023-01-05 19:04:26'
  who: ucitel
  text: Dobrý den, chtěla jsem se informovat, jak tvůrci zadání úloh kat. E,F reagují na revizi RVP a&nbsp;následně ŠVP, která z učiva fyziky ZŠ vypouští kladky, výpočet práce, tepla, Ohmův zákon... učím na ZŠ a&nbsp;v&nbsp;tuto chvíli vlastně nemohu s&nbsp;žáky počítat, protože většina učiva byla zrušena. Všechno bych musela s&nbsp;žáky dostudovat individuálně, což ztrácí smysl. Bude se podle toho zadání úloh nějak upravovat? Ví tvůrci úloh vůbec o&nbsp;těchto změnách???<br />Také se chci informovat zda je pro učitele k&nbsp;dispozici autorské řešení úloh a&nbsp;kde je možné ho získat.<br />Děkuji
