  children:
  - id: 1892
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: 4.deskový kondenzátor a intenzita E'
    posted: '2022-02-04 22:22:16'
    who: student
    text: 'Jde o&nbsp;následující zadání:<br />"Ideální deskový kondenzátor má elektrody o&nbsp;ploše S, které jsou ve vzdálenosti d.<br />Desky jsou nabité a&nbsp;intenzita elektrického pole mezi deskami je E.<br />a) Určete energii elektrického pole uvnitř kondenzátoru a&nbsp;hustotu energie tohoto<br />pole jako funkci elektrické intenzity.<br />b) Jaká je velikost síly nutné k&nbsp;tomu, aby desky kondenzátoru zůstaly oddělené?<br />c) Nyní kondenzátor ponoříme do destilované vody s&nbsp;relativní permitivitou εr = 80.<br />Určete změnu tlaku vody mezi deskami."<br />Podle mého názoru, zatímco první věta určuje parametry kondenzátoru, druhá věta popisuje jeho počáteční stav. Kdyby měl být tento stav udržován stejnosměrným zdrojem, pak bude v&nbsp;zadání uvedené, že ke kondenzátoru je připojen stejnosměrný zdroj.   '
- id: 1893
