- id: 1644
  author: JM
  email: dansker5480@gmail.com
  title: úloha kat. B
  posted: '2019-06-19 20:02:42'
  who: student
  text: Dobrý den,<br /><br />měl bych dotaz k&nbsp;autorskému řešení úlohy 2 Krajského kola kat. B.<br /><br />V řešení b) až d) je uvažován pohyb vzduchové bubliny jako rovnoměrný s&nbsp;tím, že rychlost bubliny je přímo úměrná zrychlení trubice. Nícméně ze zadání je zřejmé, že bublina se pohybuje rovnoměrně pouze v&nbsp;tíhovém poli. Při zrychlení trubice jinou velikostí zrychlení než g se bude i&nbsp;bublina pohybovat se zrychlením, protože síly, působící na bublinu nemůžou být v&nbsp;rovnováze, a&nbsp;úloha je pak těžko řešitelná na úrovni kategorie B, neboť vede k&nbsp;netriviální diferenciální rovnici. A&nbsp;určitě tento předpoklad nelze zanedbat, poněvadž pokud by bylo zrychlení trubice menší než g, tak se bublina ve směru pohybu trubice vůbec nepohne.
  children:
  - id: 1648
    author: Jan Prachař
    email: jan.prachar@fyzikalniolympiada.cz
    title: 'Re: úloha kat. B'
    posted: '2019-08-23 14:17:06'
    who: student
    text: Při vodorovném zrychlování trubice bude bublinka opravdu nejprve zrychlovat, dokud se síly na ní nedostanou do rovnováhy, potom se bude vůči trubici pohybovat rovnoměrně s&nbsp;rychlostí v&nbsp;= ka, jak je psáno v&nbsp;řešení. Doba zrychlování je v&nbsp;řešení zanedbána
- id: 1645
  author: Antonio
  email: 1centurion1@seznam.cz
  title: Když kola nepodkluzují
  posted: '2019-06-22 12:04:41'
  who: ucitel
  text: Dobrý den, právě počítám krajské kolo FO 2019 a&nbsp;mám dotaz. Jak jsme přišli na ten vzorec v&nbsp;prvním příkladu u&nbsp;toho zrychlení. Aby kola nepodkluzovala, musí být zrychlení maximálně f*g.<br />Proč tomu tak je prosím? <br />Děkuji za odpověď. Antonio
  children:
  - id: 1646
    author: Josef Jírů
    email: josef.jiru@email.cz
    title: 'Re: Když kola nepodkluzují'
    posted: '2019-06-23 22:08:03'
    who: ucitel
    text: 'Zřejmě jde o&nbsp;FO60-C-II-1. Vzorec získáme z 2. Newtonova pohybového zákona. Maximální zrychlení je určeno maximální dosažitelnou silou mezi pneumatikami a&nbsp;vozovkou&nbsp;&ndash; tou je třecí síla: a&nbsp;= F/m = fmg/m = fg. Např. na ledě je třecí síla velmi malá a&nbsp;rozjet se na něm (či rozeběhnout se) je možné pouze s&nbsp;velmi malým zrychlením. Při větším "úsilí" začnou kola (boty) prokluzovat.'
