    title: 'Re: FO_krajské kolo_kat. B úloha 4'
    posted: '2026-04-25 17:13:07'
    who: ucitel
    text: 'Ano, máte pravdu. Podle mých informací byl záměr opačný, tj. při dostatečném tření nechat kuličku bez prokluzování sjet po nakloněné rovině a&nbsp;tření zcela zanedbat na vodorovné rovině&nbsp;&ndash; v&nbsp;tomto smyslu je provedeno řešení.<br />To však nic na situaci nemění&nbsp;&ndash; je třeba buď upravit zadání, nebo upravit řešení. Bohužel není v&nbsp;mých silách tohoto cíle dosáhnout. (Třetí možnost je taková, že chyby budou archivovány trvale, z čehož radost nemám.) '
    children:
    - id: 2177
      author: Zdeněk Polák
      email: polak@gymnachod.cz
      title: 'Re: FO_krajské kolo_kat. B úloha 4'
      posted: '2026-04-25 17:48:28'
      who: ucitel
      text: Já žádný problém nevidím. Co bylo záměrem, můžeme spekulovat. Úloha je naštěstí jednoznačně zadána. K&nbsp;jednoznačnému zadání je nutno dát odpovídající řešení. Úlohu je třeba opravit podle fungujících fyzikálních zákonů a&nbsp;ne podle přání (záměrů) autora. Na webu by mělo být fyzikálně správné řešení.<br />Pokud se organizátoři rozhodnou řešit problém politicky (přijatelně pro lidi), je možné připustit variantu, že tření je nulové jenom někde, jinde naopak dostatečně velké a&nbsp;dát plný počet bodů za jakoukoli fyzikálně rozumnou cestu řešení, tedy i&nbsp;takovou, která implicitně předpokládá záměry autora.<br />Jediné co není možné, je teď měnit formulaci zadání, aby byl zřejmý záměr autora.
