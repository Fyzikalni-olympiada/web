  - id: 1640
    author: :)
    email: skola0612@gmail.com
    title: 'Re: FO 60. ročník kat. E úloha 1b)'
    posted: '2019-05-16 12:24:14'
    who: student
    text: 'Oprava: (Proč je výška v*t)'
    children:
    - id: 1641
      author: Lukáš Richterek
      email: lukas.richterek@upol.cz
      title: 'Re: FO 60. ročník kat. E úloha 1b)'
      posted: '2019-05-18 11:17:52'
      who: student
      text: Dobrý den,<br /><br />pokud vám nevyhovuje představa válce, z něhož napadal sníh do srážkoměru, můžeme postupovat i&nbsp;tak, že spočítáme, kolik dopadne do srážkoměru za 1 s. Hmotnost takového množství sněhu bude 6*3600=21600krat menší než celkových 450 g, tj. m=0,020833 g. Při sněžení tento sníh pocházel z objemu V=v*S*1 s&nbsp;= 0,6 m/s * 0.02 m^2* 1s = 0,012 m^3. Podělením m/V opět získáme výsledek z autorského řešení.<br /><br />Někteří řešitelé použili ještě jinou úvahu. Jestliže na plochu S=200 cm^2=0,02 m^2 =1/50 m^2 za dobu 6 h =21600 s&nbsp;napadlo 450 g, na plochu 1 m^2 za stejnou dobu napadlo 50*450 g = 22 500 g. Výšku 1 m vločka urazí za čas 1/v = 1/ 0,6 s&nbsp;= 1,6667 s, proto za tento čas na 1 m^2 napadlo 22500g*1,6667s/21600 s&nbsp;= 1,7361 g sněhu, což v&nbsp;objemu 1 m^3 opět odpovídá výsledku v&nbsp;řešení.<br /><br />V otázce narážíte i&nbsp;na počátek doby (obecně) sněžení. Za tu označujeme okamžik, kdy sněží v&nbsp;okolí země, nikoli od okamžiku, kdy vločka
        opustí mrak (ten by asi byl tak jako tak níže, než necelých 13 km odpovídajících součinu rychlosti a&nbsp;doby sněžení). <br /><br />Srdečně zdraví<br />Lukáš Richterek
      children:
