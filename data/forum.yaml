  author: Lenka
  title: Studijní text C
  posted: '2008-04-08 16:43:13'
  who: student
  text: Dobrý den, měla bych dotaz ohledně studijního textu pro kategorii C. Jedná se o&nbsp;příklad na straně 15. Vašemu uvedenému řešení rozumím, jen mi není jasné, proč nemůžu pro výpočet použít také vztah 18 na straně 14. Ze vztahu 14, pokud za R dosadím 18,7 ohmu, za R1=15,3 ohmu, tak mi teplota t vyjde 73,32°C, což se ale neshoduje s&nbsp;vaší vypočtenou hodnotou 82°C. Děkuji moc za vysvětlení.
  children:
  - id: 880
    author: Honza Prachař
    email: h@matfyz.cz
    title: 'Re: Studijní text C'
    posted: '2008-04-09 11:25:19'
    who: student
    text: "Milá Lenko,\r<br />tvůj postup nelze použít z toho důvodu, že součnitel elektrického odporu &alpha; závisí na zvolené vztažné teplotě. Hodnoty součnitele odporu uvedené v&nbsp;tabulce na straně 15 jsou pro vztažnou teplotu nula stupňu Celsia. Proto musíš vycházet ze vztahu R = R0(1+&alpha;t).\r<br />\r<br />Aby ti vyšel stejný výsledek, musela by si za součinitel odporu dosazovat jeho hodnotu pro vztažnou teplotu 25 stupňů."
