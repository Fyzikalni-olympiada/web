- id: 1015
  author: Tomáš Belloň
  email: t.bellon@seznam.cz
  title: Studijní texty - parodie?
  posted: '2009-10-14 19:48:41'
  who: student
  text: Vyhoďte ty idioty, co píší studijní texty. Už mám plný zuby toho, kolik v&nbsp;nich máte chyb (např. nejnovější&nbsp;&ndash; elektrické obvody). K&nbsp;čemu vám je, když umíte počítat integrály, když nevíte, že 2+2 jsou 4? To si říkáte inženýři a&nbsp;doktoři přírodních věd?
  children:
  - id: 1017
    author: Ivo Volf
    email: ivo.volf@uhk.cz
    title: 'Re: Studijní texty - parodie?'
    posted: '2009-10-15 10:56:40'
    who: student
    text: 'Tomáši Belloni,<br />nevím, zda jste učitel fyziky (doufám, že ne) nebo snad studující středoškolák. Chci vám poděkovat za vaše hodnocení dobrovolné práce několika lidí, kteří se ujali toho, že pro účastníky fyzikální olympiády píší studijní texty. Opravdu si myslím, že jste jim dodal chuti do další práce, a&nbsp;tak jste se pro ně stal nezapomenutelnou pobídkou.<br />Vaše reakce ukazuje, že jste asi nikdy nic sám nenapsal. Je všeobecně známo, že kdo nic nedělá, nic nezkazí. Autoři dále vědí, co je to tzv.  autorská slepota&nbsp;&ndash; člověk v&nbsp;dobré víře něco napíše a&nbsp;případný překlep nebo chybu potom nevidí, vidí to, co původně myslel. A&nbsp;nakonec platí s&nbsp;velkou pravděpodobností, že v&nbsp;práci, v&nbsp;níž nechceme mít žádnou chybu, bohužel aspoň jednu chybu necháme.<br />Ve slušné společnosti se nenazývají autoři bandou idiotů, ale přesně se najdou chyby (nebo to, co kritik za chybu považuje) a&nbsp;vydavatel se naopak snaží tyto chyby opravit nebo napravit.
      Proto vás jménem Fyzikální olympiády, kterou mám čest vésti, abyste mi napsal na adresu, kterou vám poskytne webmaster, vše, co ve studijních textech považujete za chybné.  Byl bych rád, kdybych se dozvěděl, kolik těch chyb je. I&nbsp;kdyby jich bylo v&nbsp;každé knížce jen pět, bylo by to na jedné straně smutné, ale snažili bychom se je odstranit alespoň v&nbsp;elektronické formě.  Byl by to velký dar našim dnešním i&nbsp;třeba budoucím soutěžícím. Bylo by jich ale mnohem méně, než když v&nbsp;diktátu zapomenete jednu čárku.<br />Jestliže považujete studijní texty za nevyhovující, pokuste se mi napsat text, který bude lepší. Možná, že dobře fotografujete, ale já bych i&nbsp;na vašich fotkách určitě našel nějakou chybu. Určitě bych o&nbsp;vás však netvrdil to, co vy si troufnete říci o&nbsp;lidech, které vůbec neznáte. <br />Když mi někdy říkají, že mnou vymyšlené úlohy jsou nemožné, požádám je, aby vymysleli úlohy "možnější" . Zpravidla mi odpoví, že vymyslet pěknou úlohu je velmi,
      velmi obtížné, nebo že to přece není jejich věc. Stalo se mi, že jsem dostal jako ukázku úlohy, které byly ještě nemožnější než ty moje. Často se před několika lety tvrdilo, že v&nbsp;úlohách a&nbsp;jejich řešení jsou chyby. Když jsem však požadoval jejich identifikaci, kritikové většinou řekli&nbsp;&ndash; už ani nevím, co to bylo, ale určitě tam chyby byly. Nebo: sestavit pěknou bezchybnou úlohu je velmi, velmi obtížné. <br />Patřím mezi autory studijních textů, tedy podle vašeho názoru "mezi ty idioty". Myslím, že byste se měl nad sebou zamyslet a&nbsp;našim autorům studijních textů se omluvit. Mne můžete vynechat. Patřím mezi ty, co mají nějaký ten titul a&nbsp;co umějí nějaký ten integrál i&nbsp;vypočítat a&nbsp;vím, že 2 + 2 nesjou čtyři, ale záleží to na číselné soustavě, ve které byla úloha zadána.  Moudrost se neváže na tituly: když se dozvím, že jsem udělal chybu, tak to přiznám a&nbsp;snažím se ji napravit. Ale na informaci, že jsou někde chyby, aniž by někdo byl schopen
      mi je označit, nemohu reagovat.<br />Ivo Volf'
    children:
    - id: 1018
      author: Tomáš Belloň
      email: t.bellon@seznam.cz
      title: 'Re: Studijní texty - parodie?'
      posted: '2009-10-15 13:28:46'
      who: student
      text: Dobrý den. Ano, uznávám, že má reakce byla nepřiměřená. Nicméně mě trochu mrzí, že když má student zájem se dozvědět něco nového a&nbsp;vaše studijní texty považuji za dobře a&nbsp;podrobně (samozřejmě v&nbsp;rámci možností) zpracované, často ho může zmást špatně vypočítaný příklad, což mu moc nepomůže. Např. ve studijním textu elektrické obvody na straně 38 píšete, že rovnici vynásobíme výrazem R1R2, ale v&nbsp;upravené rovnici po odstranění zlomku v&nbsp;prvním členu je místo R2 Rz, po odstranění Rz R1. Na straně 40 výsledek vyjde 2V, ale v&nbsp;textu je výsledek 4V. Jakou pak mají studenti jistotu, že nejsou chyby v&nbsp;samotných vzorcích?
      children:
      - id: 1019
        author: Ivo Volf
        email: ivo.volf@uhk.cz
        title: 'Re: Studijní texty - parodie?'
        posted: '2009-10-15 14:17:43'
        who: student
        text: Děkuji, Tomáši, to už je věcná diskuse. Podívám se na to a&nbsp;požádám autorku, aby to ještě jednou přešla. S&nbsp;pozdravem      Ivo Volf
        children:
