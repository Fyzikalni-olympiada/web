- id: 1836
  author: Benedikt Bareš
  email: bares.benedikt18a@student.gympldka.cz
  title: KK kat. B - Autorské řešení
  posted: '2021-04-21 17:26:14'
  who: student
  text: 'Mám několik poznámek k&nbsp;autorskému řešení krajského kola kategorie B:<br />V řešení úlohy 1a) má jako průměrná rychlost vyjít (v1+v2)/2 (tzn. ve jmenovateli 2, nikoli t).<br />V řešení 3. úlohy je v&nbsp;2. případě uveden úhel dopadu, který po nás zadání nechtělo (věta "určete rychlost" běžně znamená určení pouze její velikosti, nikoli celého jejího vektoru vč. směru, ovšem i&nbsp;takto ji lze chápat).<br />Úloha 4a) nevyjde takto jednoduše (resp. jde o&nbsp;limitní řešení pro r->0). Zřejmé to je z případu velmi velkého r (tedy tvar splávku bychom popsali spíše jako kulatou desku): ten se zřejmě nepoloží na bok ani kdyby měl těžiště až úplně nahoře v&nbsp;horní podstavě. Problém je v&nbsp;tom, že při malém vychýlení splávku se změní působiště vztlakové síly, a&nbsp;to směrem, kterým se vychýlilo těžiště celého splávku. Bohužel přesný vztah neznám,jelikož jsem ji původně nepochopil, a&nbsp;jelikož jde o&nbsp;válec, bojím se, že nevyjde úplně hezky.'
  children:
  - id: 1840
    author: Benedikt Bareš
    email: bares.benedikt18a@student.gympldka.cz
    title: 'Re: KK kat. B - Autorské řešení'
    posted: '2021-04-22 14:48:09'
    who: student
    text: Ještě jsem objevil článek zabývající se studiem stabilní polohy homogenního válce na hladině kapaliny. Kdyby se tím někdo chtěl zabývat hlouběji, může posloužit.<br /><a href="https://core.ac.uk/download/pdf/228666464.pdf" title="https://core.ac.uk/download/pdf/228666464.pdf">core.ac.uk/download/pdf/228666464.pdf</a>
