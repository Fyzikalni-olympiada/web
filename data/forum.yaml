  author: :)
  email: skola0612@gmail.com
  title: FO 60. ročník kat. E úloha 1b)
  posted: '2019-05-16 08:50:54'
  who: student
  text: Dobrý den<br />Je mi jasné, že se úloha měla počítat hustota=m/v<br />m=450g,a V=200*v a&nbsp;v=výška, ze které sníh padal. Sníh padal 21600s. A&nbsp;vy jste to brali tak, že těch 450g padá najednou,Ale sníh nepadá takhle najednou a&nbsp;padá postupně a&nbsp;kdyby tomu tak bylo tam za 21600s by spadla teprve první vločka a&nbsp;ostatní sníh by teprve padal do srážkoměru.Ale v&nbsp;zadání je, že sníh za 21600 již napadl do srážkoměru. Takže nevím, proč je výška s*t(to by muselo padat 450g najednou, ale to není asi reálné)<br />Děkuji za opravu/vysvětlení.
