  nazev: Kapitoly ze speciální teorie relativity (2. vydání)
  kategorie: A
  pdf: /texty/str2.pdf
  ps: /texty/str2.ps.gz
  pozn: Text se od prvního vydání liší ve zpracování dynamiky. Opouští se pojem relativistická hmotnost a vychází
    se ze vztahu pro výpočet relativistické hybnosti, jak je obvyklé v novějších učebnicích. Oba přístupy k výkladu
    dynamiky mají své příznivce. První vydání tohoto studijního textu lépe navazuje na učebnce fyziky používané
    v současnosti na středních školách, které s pojmem relativistická hmotnost pracují, druhé vydání lépe odpovídá
    tomu, s čím se studenti setkají po příchodu na vysoké školy.
