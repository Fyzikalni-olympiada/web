<script type="text/javascript">
	function getObj(id) {
   		if(Boolean(document.getElementById)) {
    		return document.getElementById(id);
   		} else if(Boolean(document.all)) {
    	  	return eval('document.all.'+id);
		}
	}

	function showme(id) {
		var obj = getObj("kraj_" + id);
		obj.style.display = "";
	}

	function hide(id) {
		var obj = getObj("kraj_" + id);
		obj.style.display = "none";
	}

</script>
