name: Nasazení na Firebase Hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer

      - name: Composer
        run: composer install --no-interaction

      - name: ImageMagick
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends imagemagick

      # cache miniatur ušetří generování při každém nasazení;
      # klíč je vždy nový, aby se cache po každém buildu uložila aktualizovaná
      # (při shodě klíče actions/cache nikdy neukládá)
      - name: Cache miniatur
        uses: actions/cache@v5
        with:
          path: temp/images
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Build
        run: make build

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FYZIKALNIOLYMPIADA_WEB }}
          channelId: live
          projectId: fyzikalniolympiada-web
          firebaseToolsVersion: '15'
